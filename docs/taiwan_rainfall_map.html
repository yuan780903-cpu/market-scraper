<!DOCTYPE html>
<html lang="zh-Hant"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>全台累積雨量地圖 · 2026-06-08</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;background:#f5f6f3;color:#1f2933}
  .header{background:linear-gradient(135deg,#1f3a2e,#4caf73);color:white;padding:18px 16px;text-align:center}
  .header h1{margin:0;font-size:20px;font-weight:700}
  .header p{margin:4px 0 0;color:#d8efde;font-size:13px}
  .toggle{display:flex;justify-content:center;gap:8px;padding:14px;background:#fff;border-bottom:1px solid #e6e8eb}
  .toggle button{padding:10px 22px;border:2px solid #d6dade;background:#fff;color:#555;font-size:15px;font-weight:600;border-radius:24px;cursor:pointer;transition:all .15s}
  .toggle button.active{background:#2d6a4f;color:#fff;border-color:#2d6a4f}
  #map{width:100%;height:62vh}
  .legend{padding:14px 16px;background:#fff;border-top:1px solid #e6e8eb}
  .legend-title{font-weight:700;color:#1f3a2e;margin-bottom:8px;font-size:14px}
  .legend-row{display:flex;align-items:center;gap:8px;font-size:13px;margin:4px 0}
  .legend-swatch{width:24px;height:14px;border-radius:3px;flex-shrink:0}
  .ranking{padding:14px 16px;background:#fff;margin-top:8px}
  .ranking h3{margin:0 0 10px;font-size:15px;color:#1f3a2e}
  .ranking table{width:100%;border-collapse:collapse;font-size:13px}
  .ranking td{padding:6px 4px;border-bottom:1px solid #f0f2f4}
  .ranking td.rank{width:32px;color:#888;font-weight:600}
  .ranking td.county{width:80px;font-weight:600}
  .ranking td.mm{text-align:right;font-family:ui-monospace,Menlo,monospace;font-weight:700}
  .footer{padding:14px;text-align:center;color:#888;font-size:11px;background:#f5f6f3}
  .popup-content{font-size:14px}
  .popup-content strong{color:#1f3a2e}
</style></head>
<body>
<div class="header">
  <h1>🗺️ 全台累積雨量地圖</h1>
  <p>2026-06-08 · 資料來源 Open-Meteo (ERA5) · 22 縣市</p>
</div>

<div class="toggle">
  <button data-mode="today">今日</button>
  <button data-mode="month" class="active">本月</button>
  <button data-mode="quarter">本季 (Q2)</button>
</div>

<div id="map"></div>

<div class="legend">
  <div class="legend-title">📊 顏色級距（本月 / 本季用，今日按比例縮放）</div>
  <div class="legend-row"><div class="legend-swatch" style="background:#cfe9ff"></div><span style="color:#cfe9ff;font-weight:700;width:60px">極少</span><span style="color:#555">0–30 mm</span></div>
  <div class="legend-row"><div class="legend-swatch" style="background:#7bb3eb"></div><span style="color:#7bb3eb;font-weight:700;width:60px">少雨</span><span style="color:#555">30–80 mm</span></div>
  <div class="legend-row"><div class="legend-swatch" style="background:#3a82c4"></div><span style="color:#3a82c4;font-weight:700;width:60px">普通</span><span style="color:#555">80–150 mm</span></div>
  <div class="legend-row"><div class="legend-swatch" style="background:#1d4f93"></div><span style="color:#1d4f93;font-weight:700;width:60px">略多</span><span style="color:#555">150–300 mm</span></div>
  <div class="legend-row"><div class="legend-swatch" style="background:#7b3aa2"></div><span style="color:#7b3aa2;font-weight:700;width:60px">多雨</span><span style="color:#555">300–500 mm</span></div>
  <div class="legend-row"><div class="legend-swatch" style="background:#c92a2a"></div><span style="color:#c92a2a;font-weight:700;width:60px">豪雨</span><span style="color:#555">500–800 mm</span></div>
  <div class="legend-row"><div class="legend-swatch" style="background:#6b0606"></div><span style="color:#6b0606;font-weight:700;width:60px">暴雨</span><span style="color:#555">800–∞ mm</span></div>
</div>

<div class="ranking" id="ranking">
  <h3 id="ranking-title">本月累積雨量排名</h3>
  <table id="ranking-table"><tbody></tbody></table>
</div>

<div class="footer">
  本機產出於 2026-06-08 08:25　·　資料涵蓋過去 92 天　·　大成長城企業有機肥料部
</div>

<script>
const DATA = [{"name": "臺北市", "lat": 25.04, "lon": 121.51, "today": 61.5, "month": 111.1, "quarter": 237.2}, {"name": "新北市", "lat": 25.01, "lon": 121.46, "today": 41.5, "month": 95.7, "quarter": 198.9}, {"name": "基隆市", "lat": 25.13, "lon": 121.74, "today": 56.2, "month": 125.3, "quarter": 307.6}, {"name": "桃園市", "lat": 24.99, "lon": 121.31, "today": 38.9, "month": 104.5, "quarter": 225.7}, {"name": "新竹市", "lat": 24.81, "lon": 120.97, "today": 39.7, "month": 87.3, "quarter": 156.7}, {"name": "新竹縣", "lat": 24.84, "lon": 121.01, "today": 34.3, "month": 78.9, "quarter": 150.0}, {"name": "宜蘭縣", "lat": 24.7, "lon": 121.74, "today": 13.5, "month": 80.9, "quarter": 243.7}, {"name": "苗栗縣", "lat": 24.56, "lon": 120.82, "today": 48.4, "month": 99.2, "quarter": 189.1}, {"name": "臺中市", "lat": 24.15, "lon": 120.68, "today": 37.3, "month": 111.4, "quarter": 178.9}, {"name": "彰化縣", "lat": 24.07, "lon": 120.54, "today": 48.7, "month": 107.0, "quarter": 148.1}, {"name": "南投縣", "lat": 23.91, "lon": 120.69, "today": 0, "month": 0, "quarter": 0}, {"name": "雲林縣", "lat": 23.71, "lon": 120.43, "today": 0, "month": 0, "quarter": 0}, {"name": "嘉義市", "lat": 23.48, "lon": 120.45, "today": 0, "month": 0, "quarter": 0}, {"name": "嘉義縣", "lat": 23.45, "lon": 120.45, "today": 0, "month": 0, "quarter": 0}, {"name": "臺南市", "lat": 22.99, "lon": 120.21, "today": 41.1, "month": 103.3, "quarter": 140.3}, {"name": "高雄市", "lat": 22.62, "lon": 120.31, "today": 65.3, "month": 137.7, "quarter": 183.8}, {"name": "屏東縣", "lat": 22.55, "lon": 120.55, "today": 41.0, "month": 171.1, "quarter": 239.3}, {"name": "花蓮縣", "lat": 23.99, "lon": 121.6, "today": 11.3, "month": 63.5, "quarter": 228.2}, {"name": "臺東縣", "lat": 22.75, "lon": 121.15, "today": 15.7, "month": 124.1, "quarter": 216.1}, {"name": "澎湖縣", "lat": 23.57, "lon": 119.58, "today": 20.3, "month": 59.4, "quarter": 83.3}, {"name": "金門縣", "lat": 24.43, "lon": 118.32, "today": 9.2, "month": 23.0, "quarter": 103.2}, {"name": "連江縣", "lat": 26.16, "lon": 119.95, "today": 73.2, "month": 83.9, "quarter": 177.4}];
const BANDS = [[0, 30, "#cfe9ff", "\u6975\u5c11"], [30, 80, "#7bb3eb", "\u5c11\u96e8"], [80, 150, "#3a82c4", "\u666e\u901a"], [150, 300, "#1d4f93", "\u7565\u591a"], [300, 500, "#7b3aa2", "\u591a\u96e8"], [500, 800, "#c92a2a", "\u8c6a\u96e8"], [800, 99999, "#6b0606", "\u66b4\u96e8"]];

function pickBand(v, mode) {
  // 今日 mode 用較小級距（÷10 因為單日 vs 月累積）
  const scale = (mode === 'today') ? 0.1 : 1.0;
  for (const [lo, hi, color, label] of BANDS) {
    if (v >= lo * scale && v < hi * scale) return {color, label};
  }
  return {color: '#cfe9ff', label: '極少'};
}

const map = L.map('map').setView([23.7, 121.0], 7);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap',
  maxZoom: 18,
}).addTo(map);

let markers = [];
function render(mode) {
  markers.forEach(m => map.removeLayer(m));
  markers = [];
  const sorted = [...DATA].sort((a, b) => b[mode] - a[mode]);
  for (const c of DATA) {
    const v = c[mode];
    const {color, label} = pickBand(v, mode);
    // 半徑：sqrt(雨量) * 5，上下限 8-40
    const r = Math.max(8, Math.min(40, Math.sqrt(Math.max(v, 1)) * (mode === 'today' ? 4 : 1.5)));
    const m = L.circleMarker([c.lat, c.lon], {
      radius: r,
      color: '#fff',
      weight: 2,
      fillColor: color,
      fillOpacity: 0.78,
    }).addTo(map);
    m.bindPopup(
      `<div class="popup-content"><strong>${c.name}</strong><br>` +
      `${mode === 'today' ? '今日' : mode === 'month' ? '本月累積' : '本季累積'}：` +
      `<strong style="color:${color};font-size:16px">${v.toFixed(1)} mm</strong><br>` +
      `<span style="color:#888">（${label}）</span></div>`
    );
    markers.push(m);
  }
  // 排名
  document.getElementById('ranking-title').textContent =
    (mode === 'today' ? '今日' : mode === 'month' ? '本月' : '本季') + '累積雨量排名';
  const tbody = document.querySelector('#ranking-table tbody');
  tbody.innerHTML = '';
  sorted.slice(0, 10).forEach((c, i) => {
    const {color} = pickBand(c[mode], mode);
    const row = document.createElement('tr');
    row.innerHTML = `<td class="rank">${i + 1}</td>` +
                    `<td class="county">${c.name}</td>` +
                    `<td class="mm" style="color:${color}">${c[mode].toFixed(1)} mm</td>`;
    tbody.appendChild(row);
  });
}

document.querySelectorAll('.toggle button').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.toggle button').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    render(b.dataset.mode);
  });
});

render('month');
</script>
</body></html>
