<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1f5f3a">
<title>撒肥定位 · 田地定位與肥料撒播管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{
    --bg:#eef2ec;--surface:#ffffff;--surface2:#f6f8f5;--fg:#1c2620;--muted:#66736b;--line:#dfe6df;--line2:#cfd9d0;
    --brand:#1f5f3a;--brand-2:#174a2d;--brand-soft:#e3efe6;--brand-ink:#0f3a22;
    --accent:#e0891c;--accent-soft:#fdf1e0;--blue:#1d5fb8;--blue-soft:#e6eefb;--danger:#c62828;--danger-soft:#fdeaea;
    --radius:12px;--radius-s:8px;--shadow:0 1px 2px rgba(20,40,28,.06),0 4px 14px rgba(20,40,28,.08);--shadow-s:0 1px 3px rgba(0,0,0,.18);
    --font:"Noto Sans TC",-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;width:100%;font-family:var(--font);background:var(--bg);color:var(--fg);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
  button,input,select{font-family:inherit}
  #app{display:flex;flex-direction:column;height:100%;width:100%;overflow:hidden}

  /* ===== 頂欄 ===== */
  header{display:flex;align-items:center;gap:10px;padding:8px 14px;background:linear-gradient(180deg,#22673f,#1a5232);color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.18);z-index:5;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .brand .logo{width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
  .brand h1{font-size:17px;font-weight:700;margin:0;letter-spacing:.5px;white-space:nowrap}
  .brand small{display:block;font-size:11px;opacity:.78;font-weight:400;letter-spacing:.4px}
  .projbox{display:flex;align-items:center;gap:6px;flex:1;min-width:200px}
  .projbox label{font-size:12px;opacity:.85;white-space:nowrap}
  header select{flex:1;min-width:0;border:1px solid rgba(255,255,255,.25);border-radius:var(--radius-s);padding:8px 10px;font-size:14px;background:rgba(255,255,255,.96);color:var(--fg);font-weight:500}
  .hbtn{border:1px solid rgba(255,255,255,.28);border-radius:var(--radius-s);padding:8px 12px;background:rgba(255,255,255,.12);color:#fff;font-size:14px;font-weight:500;white-space:nowrap;cursor:pointer;transition:background .15s}
  .hbtn:hover{background:rgba(255,255,255,.22)}
  .hbtn.pri{background:#fff;color:var(--brand-2);border-color:#fff}
  #searchForm{display:flex;gap:6px;flex:1 1 260px;min-width:0}
  #searchForm input{flex:1;min-width:0;border:1px solid rgba(255,255,255,.25);border-radius:var(--radius-s);padding:8px 12px;font-size:14px;background:rgba(255,255,255,.96);color:var(--fg)}
  #searchForm button{border:0;border-radius:var(--radius-s);padding:8px 14px;background:var(--accent);color:#fff;font-size:14px;font-weight:600;cursor:pointer}

  /* ===== 主區:地圖 + 面板 ===== */
  #main{flex:1;min-height:0;display:flex;flex-direction:column}
  #mapWrap{flex:1;min-height:180px;position:relative;background:#cfd9cf}
  #map{position:absolute;inset:0}
  #status{position:absolute;left:12px;bottom:36px;z-index:800;background:rgba(28,38,32,.86);color:#fff;border-radius:999px;padding:5px 12px;font-size:12px;max-width:min(70vw,420px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;backdrop-filter:blur(4px)}
  .leaflet-bar{border:0!important;box-shadow:var(--shadow-s)!important;border-radius:10px!important;overflow:hidden}
  .leaflet-bar a,.btn-locate{background:#fff!important;color:#2a3a30!important;border-bottom:1px solid var(--line)!important}
  .leaflet-control-zoom a{width:40px!important;height:40px!important;line-height:40px!important;font-size:20px!important;font-weight:400!important}
  .btn-locate{width:40px!important;height:40px!important;line-height:40px!important;font-size:20px;text-align:center;cursor:pointer;border-bottom:0!important}
  .btn-locate.on{color:var(--brand)!important;font-weight:700}
  .leaflet-control-layers{border:0!important;box-shadow:var(--shadow-s)!important;border-radius:10px!important;font-size:13px}
  .leaflet-control-layers-toggle{width:40px!important;height:40px!important}
  .leaflet-control-scale-line{border-color:#2a3a30!important;color:#2a3a30;background:rgba(255,255,255,.75)!important;font-family:var(--font)}
  .leaflet-control-attribution{font-family:var(--font);font-size:10px!important;background:rgba(255,255,255,.75)!important;border-radius:6px 0 0 0}
  .seg{display:flex;background:#fff;border-radius:10px;box-shadow:var(--shadow-s);overflow:hidden;margin:10px 0 0 10px!important}
  .seg button{border:0;background:#fff;padding:8px 12px;font-size:13px;font-weight:500;color:#2a3a30;border-right:1px solid var(--line);cursor:pointer}
  .seg button:last-child{border-right:0}
  .seg button.on{background:var(--brand);color:#fff}
  .leaflet-popup-content-wrapper{border-radius:12px;box-shadow:var(--shadow);font-family:var(--font)}
  .leaflet-popup-content{margin:12px 14px}
  .pop{font-size:14px;line-height:1.5;min-width:210px}
  .pop b{font-size:15px;color:var(--brand-ink)}
  .pop small{color:var(--muted)}
  .pop .btn{display:block;margin-top:7px;width:100%;border:0;border-radius:var(--radius-s);padding:9px;background:var(--accent);color:#fff;font-size:14px;font-weight:600;cursor:pointer}
  .pop .btn.del{background:var(--danger)}.pop .btn.nav{background:var(--blue)}

  /* ===== 專案面板 ===== */
  #panel{background:var(--surface);display:flex;flex-direction:column;max-height:44vh;border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(0,0,0,.08);transition:max-height .2s;border-radius:16px 16px 0 0}
  #panel.big{max-height:82vh}
  #panel::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--line2);margin:8px auto 0}
  #panel .bar{display:flex;align-items:center;gap:6px;padding:6px 14px 4px}
  #panel .bar b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:17px;font-weight:700;color:var(--brand-ink)}
  .bar button{border:1px solid var(--line2);background:var(--surface);border-radius:var(--radius-s);padding:6px 10px;font-size:13px;font-weight:500;color:var(--fg);white-space:nowrap;cursor:pointer}
  .bar button:hover{background:var(--surface2)}
  .bar button#delProj{color:var(--danger);border-color:#f0c9c9}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:4px 14px 10px}
  .stats span{background:var(--brand-soft);border:1px solid #cfe3d5;border-radius:10px;padding:8px 10px;font-size:13px;font-weight:600;color:var(--brand-ink);text-align:center;line-height:1.3}
  #body{overflow-y:auto;overflow-x:hidden;padding:0 14px 14px;-webkit-overflow-scrolling:touch;touch-action:pan-y}
  .form{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;padding:6px 0 14px;border-bottom:1px solid var(--line);margin-bottom:6px}
  .form[hidden]{display:none}
  .form label{font-size:12px;color:var(--muted);display:block;margin-bottom:3px;font-weight:500}
  .form input{width:100%;border:1px solid var(--line2);border-radius:var(--radius-s);padding:9px 10px;font-size:15px;background:#fff;transition:border-color .15s,box-shadow .15s}
  .form input:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 3px rgba(31,95,58,.15)}
  .form .full{grid-column:1/-1}
  .form .ro{background:var(--surface2);font-weight:700;color:var(--brand-ink)}
  .item{padding:12px;border:1px solid var(--line);border-radius:var(--radius);margin-top:10px;background:var(--surface);box-shadow:0 1px 2px rgba(20,40,28,.04)}
  .item .row{display:flex;align-items:center;gap:8px}
  .item .t{flex:1;min-width:0;cursor:pointer}
  .item .t b{font-size:15px;color:var(--brand-ink);word-break:break-all;line-height:1.35}
  .item .t small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
  .item input.ton{width:76px;border:1px solid var(--line2);border-radius:var(--radius-s);padding:8px;font-size:15px;text-align:right;font-weight:600}
  .item input.ton:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 3px rgba(31,95,58,.15)}
  .item .unit{font-size:12px;color:var(--muted)}
  .item .del{border:0;background:var(--danger-soft);color:var(--danger);border-radius:var(--radius-s);padding:8px 10px;font-size:13px;font-weight:500;cursor:pointer}
  .item .acts{display:flex;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap}
  .item .acts button,.item .acts label{border:0;border-radius:var(--radius-s);padding:8px 12px;font-size:13px;font-weight:600;color:#fff;background:var(--blue);cursor:pointer}
  .item .acts label{background:var(--brand)}
  .item .acts label input{display:none}
  .thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .thumbs img{width:76px;height:76px;object-fit:cover;border-radius:10px;border:1px solid var(--line);background:#eee;cursor:zoom-in}
  .empty{padding:18px 12px;color:var(--muted);font-size:13px;text-align:center;border:1px dashed var(--line2);border-radius:var(--radius);margin-top:10px;line-height:1.6}

  /* ===== 對話框 ===== */
  #dlg,#viewer{position:fixed;inset:0;background:rgba(15,25,18,.5);z-index:2000;display:none;align-items:flex-end;justify-content:center}
  #dlg .box{background:var(--surface);width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:18px 18px 28px;max-height:88vh;overflow:auto;box-shadow:var(--shadow)}
  #dlg h3{margin:0 0 8px;font-size:17px;color:var(--brand-ink)}
  #dlg p{font-size:13px;color:var(--muted);margin:6px 0;line-height:1.6}
  #dlg input{width:100%;border:1px solid var(--line2);border-radius:var(--radius-s);padding:10px;font-size:15px}
  #dlg input:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 3px rgba(31,95,58,.15)}
  #dlg .row{display:flex;gap:8px;margin-top:10px}
  #dlg .row button{flex:1;border:0;border-radius:var(--radius-s);padding:11px;font-size:14px;font-weight:600;background:var(--brand);color:#fff;cursor:pointer}
  #dlg .row button.sec{background:var(--surface2);color:var(--fg);border:1px solid var(--line2)}
  #viewer{background:rgba(0,0,0,.94);align-items:center;flex-direction:column}
  #viewer img{max-width:100%;max-height:80vh;object-fit:contain}
  #viewer .vb{display:flex;gap:10px;margin-top:12px}
  #viewer .vb button{border:0;border-radius:var(--radius-s);padding:10px 18px;font-size:14px;font-weight:600;background:#fff;cursor:pointer}
  #viewer .vb button.del{background:var(--danger);color:#fff}
  #viewer .cap{color:#fff;font-size:13px;margin-top:8px}

  /* ===== 電腦版:地圖左、面板右 ===== */
  @media (min-width: 900px){
    header{padding:10px 20px;flex-wrap:nowrap}
    .brand h1{font-size:18px}
    #main{flex-direction:row}
    #mapWrap{min-height:0}
    #panel{width:440px;max-height:none;height:100%;border-top:0;border-left:1px solid var(--line);border-radius:0;box-shadow:-4px 0 16px rgba(0,0,0,.06)}
    #panel.big{max-height:none;width:560px}
    #panel::before{display:none}
    #panel .bar{padding:14px 18px 6px}
    .stats{padding:4px 18px 12px}
    #body{padding:0 18px 18px}
    #dlg{align-items:center}
    #dlg .box{border-radius:16px;padding:22px}
    #status{bottom:12px;left:50%;transform:translateX(-50%)}
  }
  @media (max-width: 480px){
    .stats span{font-size:12px;padding:7px 6px}
    .brand small{display:none}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand"><div class="logo">🌾</div><div><h1>撒肥定位</h1><small>田地定位 · 肥料撒播管理</small></div></div>
    <div class="projbox"><label>專案</label><select id="projSel"></select><button class="hbtn pri" id="newProj" title="新增專案">＋ 新增</button></div>
    <form id="searchForm"><input id="q" placeholder="搜尋地址 / 地名(例:台南市麻豆區)" autocomplete="off"><button type="submit">搜尋</button></form>
    <button class="hbtn" id="menuBtn" title="雲端同步 / 匯出匯入">☁ 雲端</button>
  </header>
  <div id="main">
    <div id="mapWrap"><div id="map"></div><div id="status">載入中…</div></div>
    <div id="panel">
      <div class="bar"><b id="projTitle">專案</b><button id="toggleForm">資料 ▾</button><button id="bigBtn">清單 ⤢</button><button id="delProj">刪除</button></div>
      <div class="stats" id="stats"></div>
      <div id="body">
        <div class="form" id="form">
          <div><label>客戶名稱</label><input id="f_customer" placeholder="例:王大明"></div>
          <div><label>申報日期</label><input id="f_date" type="date"></div>
          <div><label>肥料品牌</label><input id="f_brand" list="dl_brand" placeholder="例:碩成"><datalist id="dl_brand"></datalist></div>
          <div><label>肥料品目</label><input id="f_product" list="dl_product" placeholder="例:有機肥料2號(粉)"><datalist id="dl_product"></datalist></div>
          <div><label>肥料重量(每塊田預設,噸)</label><input id="f_weight" type="number" inputmode="decimal" step="0.01" placeholder="例:0.5"></div>
          <div><label>總噸數(各田加總)</label><input id="f_total" class="ro" readonly></div>
          <div class="full"><label>備註</label><input id="f_note" placeholder="例:9月中前撒完"></div>
        </div>
        <div id="list"></div>
      </div>
    </div>
  </div>
</div>

<div id="dlg"><div class="box">
  <h3>☁ 雲端同步 / 匯出匯入</h3>
  <p>資料與照片存在你自己的 Cloudflare 帳號。設定一組<b>同步碼</b>(至少 6 個字,像密碼),之後每次修改會自動上傳;另一支手機或電腦輸入同一組同步碼就能讀到同樣的專案與照片。</p>
  <input id="syncCode" placeholder="同步碼(例:shuocheng-2026)" autocomplete="off">
  <div class="row"><button id="saveSync">儲存同步碼並讀取雲端</button></div>
  <div class="row"><button id="cloudUp">☁ 立即上傳</button><button id="cloudDown">☁ 讀取雲端</button></div>
  <div class="row"><button class="sec" id="expFile">📁 匯出檔案(JSON)</button><button class="sec" id="impFile">📁 匯入檔案</button></div>
  <input type="file" id="impInput" accept=".json,application/json" style="display:none">
  <div class="row"><button class="sec" id="closeDlg">關閉</button></div>
  <p id="dlgMsg"></p>
</div></div>
<div id="viewer"><img id="vImg" alt=""><div class="cap" id="vCap"></div><div class="vb"><button id="vClose">關閉</button><button class="del" id="vDel">刪除照片</button></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// ================= 代理 / 雲端 =================
const PROXY='https://nlsc-proxy.yuan780903.workers.dev';
const SYNC='https://fert-sync.yuan780903.workers.dev';
const via = u => `${PROXY}/?url=${encodeURIComponent(u)}`;

// ================= 圖層 =================
const NLSC = (layer, opt={}) => L.tileLayer(`https://wmts.nlsc.gov.tw/wmts/${layer}/default/GoogleMapsCompatible/{z}/{y}/{x}`,
  Object.assign({maxZoom:21, maxNativeZoom:19, attribution:'© 國土測繪中心'}, opt));
const gSat  = L.tileLayer('https://mt{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}',{subdomains:'0123',maxZoom:21,maxNativeZoom:20,attribution:'© Google'});
const gRoad = L.tileLayer('https://mt{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}',{subdomains:'0123',maxZoom:21,maxNativeZoom:20,attribution:'© Google'});
const photo = NLSC('PHOTO2'), emap = NLSC('EMAP');
const cadastre = L.tileLayer(`${PROXY}/landmaps.nlsc.gov.tw/S_Maps/wmts/DMAPS/default/EPSG:3857/{z}/{y}/{x}`,
  {minZoom:15, maxZoom:21, maxNativeZoom:20, opacity:.9, attribution:'地籍圖僅供參考'});
const section = NLSC('LANDSECT',{minZoom:13, opacity:.9});
const map = L.map('map',{zoomControl:false, attributionControl:false, layers:[gSat, cadastre]}).setView([23.165,120.235], 17);
L.control.zoom({position:'bottomright'}).addTo(map);
L.control.scale({imperial:false, position:'bottomleft'}).addTo(map);
L.control.attribution({prefix:false, position:'bottomright'}).addTo(map);
const BASES={'Google 衛星':gSat,'國土正射':photo,'電子地圖':emap};
const Seg=L.Control.extend({ onAdd(){ const d=L.DomUtil.create('div','seg'); L.DomEvent.disableClickPropagation(d);
  Object.entries(BASES).forEach(([n,l])=>{ const b=L.DomUtil.create('button','',d); b.textContent=n; b.dataset.n=n; b.onclick=()=>{ Object.values(BASES).forEach(x=>map.removeLayer(x)); map.removeLayer(gRoad); l.addTo(map); l.bringToBack(); segSync(); }; }); return d; } });
new Seg({position:'topleft'}).addTo(map);
function segSync(){ document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on', map.hasLayer(BASES[b.dataset.n]))); }
map.on('baselayerchange', segSync); setTimeout(segSync,0);
L.control.layers({'Google 衛星':gSat,'Google 街道':gRoad,'正射影像(國土測繪)':photo,'電子地圖(國土測繪)':emap},
  {'地籍圖(地號界線)':cadastre,'段籍圖':section},{position:'topright',collapsed:true}).addTo(map);

// ================= 我的位置 =================
let me=null, meCircle=null, watchId=null;
const Locate = L.Control.extend({ onAdd(){ const b=L.DomUtil.create('div','leaflet-bar btn-locate'); b.textContent='◎'; b.title='我的位置';
  L.DomEvent.on(b,'click',e=>{L.DomEvent.stop(e); toggleLocate(b);}); return b; } });
new Locate({position:'bottomright'}).addTo(map);
function toggleLocate(btn){
  if(watchId!==null){ navigator.geolocation.clearWatch(watchId); watchId=null; btn.classList.remove('on'); setStatus('已停止定位'); return; }
  if(!navigator.geolocation){ setStatus('此裝置不支援定位'); return; }
  btn.classList.add('on'); setStatus('定位中…'); let first=true;
  watchId=navigator.geolocation.watchPosition(p=>{
    const ll=[p.coords.latitude,p.coords.longitude], acc=p.coords.accuracy;
    if(!me){ me=L.circleMarker(ll,{radius:8,color:'#fff',weight:2,fillColor:'#1976d2',fillOpacity:1}).addTo(map);
             meCircle=L.circle(ll,{radius:acc,color:'#1976d2',weight:1,fillOpacity:.12}).addTo(map); }
    else { me.setLatLng(ll); meCircle.setLatLng(ll).setRadius(acc); }
    if(first){ map.setView(ll, Math.max(map.getZoom(),17)); first=false; }
    setStatus(`我的位置 ${ll[0].toFixed(5)}, ${ll[1].toFixed(5)}(誤差 ±${Math.round(acc)} m)`);
  }, err=>{ setStatus('定位失敗:'+err.message); btn.classList.remove('on'); watchId=null; },
  {enableHighAccuracy:true, maximumAge:2000, timeout:15000});
}

// ================= 地址搜尋 =================
let searchPin=null;
document.getElementById('searchForm').addEventListener('submit', async e=>{
  e.preventDefault(); const q=document.getElementById('q').value.trim(); if(!q) return; setStatus('搜尋中…');
  try{ const r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=tw&accept-language=zh-TW&q=${encodeURIComponent(q)}`);
    const j=await r.json(); if(!j.length){ setStatus('找不到:'+q); return; }
    const ll=[+j[0].lat,+j[0].lon]; if(searchPin) searchPin.remove();
    searchPin=L.marker(ll).addTo(map).bindPopup(j[0].display_name).openPopup(); map.setView(ll,17); setStatus('已定位,點田即可查地號');
  }catch(err){ setStatus('搜尋失敗,請檢查網路'); }
});

// ================= 點地圖 → 查地號 =================
const jsonp = async u => { const t=await (await fetch(via(u))).text(); const m=t.match(/^\s*\w*\((.*)\)\s*;?\s*$/s); return JSON.parse(m?m[1]:t); };
const b64 = s => { try{ return decodeURIComponent(escape(atob(s))); }catch{ return s; } };
const sleep = ms => new Promise(r=>setTimeout(r,ms));
const fmtNo = n => { const s=String(n).padStart(8,'0'); const a=+s.slice(0,4), b=+s.slice(4); return b? `${a}-${b}` : String(a); };
async function queryParcel(lat, lng){
  const xml = await (await fetch(`${PROXY}/api.nlsc.gov.tw/other/TownVillagePointQuery/${lng}/${lat}/4326`)).text();
  const g = tag => (xml.match(new RegExp(`<${tag}>([^<]*)<`))||[])[1]||'';
  const cty=g('ctyCode'); if(!cty) throw new Error('此位置不在臺灣地籍範圍');
  const r = (await jsonp(`https://landmaps.nlsc.gov.tw/S_Maps/qryTileMapIndex?type=2&flag=1&city=${cty}&x=${lng}&y=${lat}&alpah=0.5f&callback=cb`))[0]||[]; const p=r[0]||{};
  if(!p.landno) throw new Error(p.msg||'查無地號');
  const parcel = { key:`${p.office}${p.sect}${p.landno}`, office:p.office, sect:p.sect, landno:p.landno, no:fmtNo(p.landno),
    officeName:b64(p.officeStr), sectName:b64(p.sectStr), cty:g('ctyName'), town:g('townName'),
    bbox:[[+p.ly,+p.lx],[+p.ry,+p.rx]], center:[+p.cy,+p.cx], image:null, t:null, photos:[], area:null };
  parcel.area = await fetchArea(parcel);
  const iq = `https://landmaps.nlsc.gov.tw/S_Maps/qryTileMapIndex?type=2&flag=2&office=${p.office}&sect=${p.sect}&landno=${p.landno}&imgflag=1&alpah=0.5f&callback=cb`;
  for(let i=0;i<5;i++){ const rows=(await jsonp(iq))[0]||[]; const im=rows.find(x=>x.image);
    if(im){ parcel.image='data:image/png;base64,'+im.image; parcel.bbox=[[+im.ly,+im.lx],[+im.ry,+im.rx]]; break; } await sleep(700); }
  return parcel;
}
async function fetchArea(f){ try{ const r=await (await fetch(via('https://api.nlsc.gov.tw/S09_Ralid/getLandInfo'),{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:`city=${f.office[0]}&sect=${f.sect}&landno=${f.landno}`})).json(); const a=r&&r.ralid&&+r.ralid.AA10; return a>0?a:null; }catch{ return null; } }
const FEN=969.917; // 1 分 = 969.917 m²(1 甲 = 10 分)
const fmtArea = m2 => m2==null ? '面積查詢中' : `${(m2/10000).toFixed(2)} 公頃(${(m2/FEN).toFixed(1)} 分)`;
let previewLayer=null, lastParcel=null;
map.on('click', async e=>{
  if(map.getZoom()<16){ setStatus('請放大到 16 以上再點田查地號(目前 '+map.getZoom()+')'); return; }
  setStatus('查詢地號中…'); if(previewLayer){ previewLayer.remove(); previewLayer=null; }
  try{ const p = await queryParcel(e.latlng.lat, e.latlng.lng); lastParcel=p;
    previewLayer = drawParcel(p,'#ffeb3b').addTo(map);
    L.popup({maxWidth:260}).setLatLng(p.center).setContent(popupHTML(p, !!cur().fields[p.key])).openOn(map);
    setStatus(fullName(p));
  }catch(err){ setStatus('查地號失敗:'+err.message); }
});
function drawParcel(p,color){ return p.image ? L.imageOverlay(p.image,p.bbox,{opacity:.75,interactive:false,className:'parcel-img'}) : L.rectangle(p.bbox,{color,weight:3,fillOpacity:.25}); }
const fullName = p => `${p.cty}${p.town} ${p.sectName} ${p.no} 地號`;
const navUrl = p => `https://www.google.com/maps/dir/?api=1&destination=${p.center[0]},${p.center[1]}&travelmode=driving`;
function popupHTML(p, sel){
  return `<div class="pop"><b>${esc(fullName(p))}</b><br><small>${esc(p.officeName)}地政事務所 · ${p.area?fmtArea(p.area):'面積不明'}</small>
    ${sel ? `<button class="btn del" onclick="unselect('${p.key}')">✖ 從專案移除</button>` : `<button class="btn" onclick="selectCurrent()">✔ 加入「${esc(cur().customer||cur().name)}」</button>`}
    <button class="btn nav" onclick="window.open('${navUrl(p)}','_blank')">🧭 Google 導航到這塊田</button></div>`;
}

// ================= 專案資料(存本機) =================
const KEY='fertmap_projects_v1';
let DB = load();
function load(){ let d=null; try{ d=JSON.parse(localStorage.getItem(KEY)||'null'); }catch{}
  if(!(d&&d.projects&&d.projects.length)){ const p=newProject('專案 1'); d={curId:p.id, projects:[p]}; }
  migrate(d); return d; }
function migrate(d){ // 舊版公斤 → 噸(只做一次)
  if(d.unit==='t') return;
  d.projects.forEach(p=>{ if(p.weight!==''&&p.weight!=null&&!isNaN(+p.weight)) p.weight=String(+p.weight/1000);
    Object.values(p.fields||{}).forEach(f=>{ if(f.kg!=null&&f.t==null) f.t=+f.kg/1000; delete f.kg; if(!f.photos) f.photos=[]; if(f.area===undefined) f.area=null; }); });
  d.unit='t'; }
function newProject(name){ return {id:'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6), name, customer:'', brand:'', product:'', weight:'', date:new Date().toISOString().slice(0,10), note:'', fields:{}, updated:Date.now()}; }
function cur(){ return DB.projects.find(p=>p.id===DB.curId) || DB.projects[0]; }
function persist(){ localStorage.setItem(KEY, JSON.stringify(DB)); }
function save(){ cur().updated=Date.now(); persist(); render(); autoSync(); }
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tons = p => Object.values(p.fields).reduce((s,f)=>s+(+f.t||0),0);
const fmtT = v => (Math.round(v*1000)/1000).toString();

function selectCurrent(){ if(!lastParcel) return; const p=cur(); lastParcel.t = p.weight!==''&&!isNaN(+p.weight)? +p.weight : null; p.fields[lastParcel.key]=lastParcel; save(); map.closePopup(); if(previewLayer){previewLayer.remove();previewLayer=null;} setStatus('已加入 '+fullName(lastParcel)); }
function unselect(key){ delete cur().fields[key]; save(); map.closePopup(); }
function setT(key,v){ const f=cur().fields[key]; if(f){ f.t = v===''?null:+v; cur().updated=Date.now(); persist(); refreshTotals(); refreshMarker(f); autoSync(); } }
function refreshTotals(){ const p=cur(); const fs=Object.values(p.fields); const area=fs.reduce((s,f)=>s+(+f.area||0),0); const unknown=fs.filter(f=>!f.area).length;
  document.getElementById('f_total').value = fmtT(tons(p))+' 噸'; document.getElementById('projTitle').textContent=(p.customer||p.name);
  document.getElementById('stats').innerHTML = `<span>🌾 ${fs.length} 塊田</span><span>📐 ${(area/10000).toFixed(2)} 公頃<br><small style="font-weight:500">${(area/FEN).toFixed(1)} 分${unknown?` · ${unknown} 塊待查`:''}</small></span><span>⚖️ ${fmtT(tons(p))} 噸</span>`; }
function flyTo(key){ const f=cur().fields[key]; if(f) map.fitBounds(f.bbox,{maxZoom:18}); }
function nav(key){ const f=cur().fields[key]; if(f) window.open(navUrl(f),'_blank'); }

// ---- 表單綁定 ----
const F={customer:'f_customer',date:'f_date',brand:'f_brand',product:'f_product',weight:'f_weight',note:'f_note'};
Object.entries(F).forEach(([k,id])=>document.getElementById(id).addEventListener('change',e=>{ cur()[k]=e.target.value; if(k==='customer') cur().name=e.target.value||cur().name; save(); }));
document.getElementById('projSel').onchange=e=>{ DB.curId=e.target.value; persist(); render(); const fs=Object.values(cur().fields); if(fs.length) map.fitBounds(L.latLngBounds(fs.flatMap(f=>f.bbox)).pad(.3)); };
document.getElementById('newProj').onclick=()=>{ const n=prompt('客戶名稱 / 專案名稱?'); if(n===null) return; const p=newProject(n||('專案 '+(DB.projects.length+1))); p.customer=n||''; DB.projects.push(p); DB.curId=p.id; save(); setFormOpen(true); };
document.getElementById('delProj').onclick=()=>{ const p=cur(); if(!confirm(`確定刪除專案「${p.customer||p.name}」(含 ${Object.keys(p.fields).length} 塊田)?`)) return; DB.deleted=DB.deleted||{}; DB.deleted[p.id]=Date.now(); DB.projects=DB.projects.filter(x=>x.id!==p.id); if(!DB.projects.length) DB.projects.push(newProject('專案 1')); DB.curId=DB.projects[0].id; save(); };
function setFormOpen(open){ document.getElementById('form').hidden=!open; document.getElementById('toggleForm').textContent=open?'資料 ▾':'資料 ▸'; localStorage.setItem('fertmap_formOpen', open?'1':'0'); }
document.getElementById('toggleForm').onclick=()=>setFormOpen(document.getElementById('form').hidden);
setFormOpen(localStorage.getItem('fertmap_formOpen')!=='0');
document.getElementById('bigBtn').onclick=e=>{ const big=document.getElementById('panel').classList.toggle('big'); e.target.textContent=big?'清單 ⤡':'清單 ⤢'; setTimeout(()=>map.invalidateSize(),250); };
window.addEventListener('resize', ()=>map.invalidateSize());

// ---- 畫面 ----
const layers={}, areaTried=new Set();
const markerHTML = f => `<div style="background:#f57c00;color:#fff;border-radius:6px;padding:2px 6px;font-size:12px;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.4)">✔ ${f.no}${f.t?` · ${fmtT(f.t)}噸`:''}${f.photos&&f.photos.length?' 📷':''}</div>`;
function refreshMarker(f){ if(layers[f.key]){ layers[f.key].remove(); delete layers[f.key]; } addLayer(f); }
function addLayer(f){ const g=L.layerGroup([drawParcel(f,'#f57c00'), L.marker(f.center,{icon:L.divIcon({className:'',html:markerHTML(f),iconAnchor:[0,10]})})]);
  g.on('click',()=>{ lastParcel=f; L.popup({maxWidth:260}).setLatLng(f.center).setContent(popupHTML(f,true)).openOn(map); }); layers[f.key]=g.addTo(map); }
function render(){
  const p=cur();
  const sel=document.getElementById('projSel');
  sel.innerHTML=DB.projects.map(x=>`<option value="${x.id}" ${x.id===p.id?'selected':''}>${esc(x.customer||x.name)}(${Object.keys(x.fields).length}田)</option>`).join('');
  Object.entries(F).forEach(([k,id])=>document.getElementById(id).value=p[k]||'');
  refreshTotals();
  const uniq=k=>[...new Set(DB.projects.map(x=>x[k]).filter(Boolean))];
  document.getElementById('dl_brand').innerHTML=uniq('brand').map(v=>`<option value="${esc(v)}">`).join('');
  document.getElementById('dl_product').innerHTML=uniq('product').map(v=>`<option value="${esc(v)}">`).join('');
  Object.keys(layers).forEach(k=>{ if(!p.fields[k]){ layers[k].remove(); delete layers[k]; } });
  Object.values(p.fields).forEach(f=>{ if(!layers[f.key]) addLayer(f); });
  const arr=Object.values(p.fields);
  document.getElementById('list').innerHTML = (arr.length ? arr.map(f=>`<div class="item" id="it_${f.key}">
      <div class="row"><div class="t" onclick="flyTo('${f.key}')"><b>${esc(fullName(f))}</b><small>${f.area?fmtArea(f.area):'面積查詢中…'} · ${esc(f.officeName)}地政 · 點此在地圖顯示</small></div>
        <input class="ton" type="number" inputmode="decimal" step="0.01" placeholder="噸" value="${f.t??''}" onchange="setT('${f.key}',this.value)"><span class="unit">噸</span>
        <button class="del" onclick="unselect('${f.key}')">移除</button></div>
      <div class="acts"><button onclick="nav('${f.key}')">🧭 Google 導航</button>
        <label>📷 拍照/上傳<input type="file" accept="image/*" capture="environment" multiple onchange="addPhotos('${f.key}',this)"></label>
        <span class="unit">${(f.photos||[]).length} 張照片</span></div>
      <div class="thumbs" id="th_${f.key}">${(f.photos||[]).map(ph=>`<img data-id="${ph.id}" alt="" onclick="openPhoto('${f.key}','${ph.id}')" title="${esc(ph.time||'')}">`).join('')}</div>
    </div>`).join('')
    : '<div class="empty">放大地圖後點田地 → 顯示地號 → 按「加入」;每塊田可填噸數、拍現場照片(噴漆記號、地形),施工人員可導航並看照片核對</div>');
  arr.forEach(f=>(f.photos||[]).forEach(ph=>showThumb(f.key, ph.id)));
  arr.filter(f=>!f.area&&!areaTried.has(f.key)).forEach(async f=>{ areaTried.add(f.key); const a=await fetchArea(f); if(a){ f.area=a; persist(); if(cur().fields[f.key]===f) render(); } });
}

// ================= 照片(本機 IndexedDB + 雲端) =================
const idb = { db:null,
  open(){ return this.db ? Promise.resolve(this.db) : new Promise((res,rej)=>{ const r=indexedDB.open('fertmap',1); r.onupgradeneeded=()=>r.result.createObjectStore('photos'); r.onsuccess=()=>res(this.db=r.result); r.onerror=()=>rej(r.error); }); },
  async get(id){ const d=await this.open(); return new Promise((res,rej)=>{ const r=d.transaction('photos').objectStore('photos').get(id); r.onsuccess=()=>res(r.result||null); r.onerror=()=>rej(r.error); }); },
  async put(id,v){ const d=await this.open(); return new Promise((res,rej)=>{ const r=d.transaction('photos','readwrite').objectStore('photos').put(v,id); r.onsuccess=()=>res(); r.onerror=()=>rej(r.error); }); },
  async del(id){ const d=await this.open(); return new Promise((res,rej)=>{ const r=d.transaction('photos','readwrite').objectStore('photos').delete(id); r.onsuccess=()=>res(); r.onerror=()=>rej(r.error); }); } };
const memPhoto={};
async function getPhoto(id){ if(memPhoto[id]) return memPhoto[id]; let v=await idb.get(id).catch(()=>null);
  if(!v && code()){ try{ const r=await fetch(`${SYNC}/photo?code=${encodeURIComponent(code())}&id=${id}`); if(r.ok){ v=await r.text(); await idb.put(id,v).catch(()=>{}); } }catch{} }
  if(v) memPhoto[id]=v; return v; }
async function showThumb(key,id){ const img=document.querySelector(`#th_${key} img[data-id="${id}"]`); if(!img) return; const v=await getPhoto(id); if(v) img.src=v; else img.alt='☁?'; }
function shrink(file){ return new Promise((res,rej)=>{ const img=new Image(); const u=URL.createObjectURL(file);
  img.onload=()=>{ const max=1280, s=Math.min(1, max/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(u); res(c.toDataURL('image/jpeg',.72)); };
  img.onerror=()=>rej(new Error('讀取照片失敗')); img.src=u; }); }
async function addPhotos(key, input){ const f=cur().fields[key]; if(!f) return; f.photos=f.photos||[];
  for(const file of input.files){ try{ setStatus('照片處理中…'); const data=await shrink(file);
      const id='ph'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); await idb.put(id,data).catch(()=>{}); memPhoto[id]=data;
      f.photos.push({id, time:new Date().toLocaleString('zh-TW',{hour12:false})});
      if(code()){ const r=await (await fetch(`${SYNC}/photo`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:code(),id,data})})).json(); if(!r.ok) setStatus('照片上傳雲端失敗:'+r.error); }
    }catch(err){ setStatus('照片失敗:'+err.message); } }
  input.value=''; cur().updated=Date.now(); persist(); render(); autoSync(); setStatus('已加入照片'+(code()?',並上傳雲端':'(未設同步碼,只存本機)')); }
let viewing=null;
async function openPhoto(key,id){ const f=cur().fields[key]; const ph=(f.photos||[]).find(x=>x.id===id); const v=await getPhoto(id); if(!v){ setStatus('照片還沒下載到,請確認同步碼'); return; }
  viewing={key,id}; document.getElementById('vImg').src=v; document.getElementById('vCap').textContent=fullName(f)+' · '+(ph&&ph.time||''); document.getElementById('viewer').style.display='flex'; }
document.getElementById('vClose').onclick=()=>document.getElementById('viewer').style.display='none';
document.getElementById('vDel').onclick=async()=>{ if(!viewing||!confirm('刪除這張照片?')) return; const f=cur().fields[viewing.key]; f.photos=(f.photos||[]).filter(x=>x.id!==viewing.id);
  idb.del(viewing.id).catch(()=>{}); delete memPhoto[viewing.id];
  if(code()) fetch(`${SYNC}/photo-del`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:code(),id:viewing.id})}).catch(()=>{});
  document.getElementById('viewer').style.display='none'; save(); };

// ================= 雲端同步 / 匯出匯入 =================
const dlg=document.getElementById('dlg'), msg=t=>document.getElementById('dlgMsg').textContent=t;
const code=()=> (localStorage.getItem('fertmap_sync')||'').trim();
document.getElementById('menuBtn').onclick=()=>{ document.getElementById('syncCode').value=code(); msg(code()?'目前同步碼已設定,修改會自動上傳':'尚未設定同步碼'); dlg.style.display='flex'; };
document.getElementById('closeDlg').onclick=()=>dlg.style.display='none';
document.getElementById('saveSync').onclick=async()=>{ const c=document.getElementById('syncCode').value.trim(); if(c.length<6){ msg('同步碼至少 6 個字'); return; }
  localStorage.setItem('fertmap_sync',c); msg('已儲存同步碼,讀取雲端中…'); const r=await cloudLoad(); if(!r) await cloudSave(); };
async function cloudSave(){ const c=code(); if(!c) return false; try{
    const r=await (await fetch(SYNC+'/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:c,data:DB})})).json();
    if(!r.ok) throw new Error(r.error); setStatus('☁ 已同步 '+r.time); msg('已上傳雲端('+r.time+',共 '+r.projects+' 個專案)'); return true;
  }catch(err){ setStatus('☁ 上傳失敗:'+err.message); msg('上傳失敗:'+err.message); return false; } }
async function cloudLoad(){ const c=code(); if(!c) return false; try{
    const r=await (await fetch(SYNC+'/load?code='+encodeURIComponent(c))).json();
    if(!r.ok) throw new Error(r.error); mergeIn(r.data); setStatus('☁ 已讀取雲端 '+r.time); msg('已讀取雲端('+r.time+'),與本機合併完成'); return true;
  }catch(err){ setStatus('☁ 讀取:'+err.message); msg('讀取:'+err.message); return false; } }
document.getElementById('cloudUp').onclick=()=>{ if(!code()) return msg('請先設定同步碼'); msg('上傳中…'); cloudSave(); };
document.getElementById('cloudDown').onclick=()=>{ if(!code()) return msg('請先設定同步碼'); msg('讀取中…'); cloudLoad(); };
let syncTimer=null; function autoSync(){ if(!code()) return; clearTimeout(syncTimer); syncTimer=setTimeout(cloudSave, 1500); }
document.getElementById('expFile').onclick=()=>{ const blob=new Blob([JSON.stringify(DB,null,1)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`撒肥專案_${new Date().toISOString().slice(0,10)}.json`; a.click(); msg('已匯出(不含照片檔,照片在雲端),請選「儲存到檔案 / 雲端硬碟」'); };
document.getElementById('impFile').onclick=()=>document.getElementById('impInput').click();
document.getElementById('impInput').onchange=async e=>{ const f=e.target.files[0]; if(!f) return; try{ mergeIn(JSON.parse(await f.text())); msg('已匯入 '+f.name); autoSync(); }catch(err){ msg('匯入失敗:'+err.message); } e.target.value=''; };
function mergeIn(d){ const list = d.projects || (Array.isArray(d)?d:null); if(!list) throw new Error('格式不符');
  if(d.unit!=='t') migrate({projects:list});
  DB.deleted = Object.assign({}, DB.deleted||{}, d.deleted||{});
  list.forEach(np=>{ if((DB.deleted[np.id]||0) > (np.updated||0)) return;
    const i=DB.projects.findIndex(x=>x.id===np.id); if(i<0) DB.projects.push(np); else if((np.updated||0)>(DB.projects[i].updated||0)) DB.projects[i]=np; });
  DB.projects = DB.projects.filter(p=>!((DB.deleted[p.id]||0) > (p.updated||0)));
  const blank=p=>!p.customer&&!p.brand&&!p.product&&!p.note&&!Object.keys(p.fields||{}).length;
  if(DB.projects.some(p=>!blank(p))) DB.projects=DB.projects.filter(p=>!blank(p));
  if(!DB.projects.length) DB.projects.push(newProject('專案 1'));
  if(!cur()) DB.curId=DB.projects[0].id; persist(); render(); }

function setStatus(t){ document.getElementById('status').textContent=t; }
render(); setStatus('放大到 16 以上,點田地即可查地號並加入專案'); if(code()) cloudLoad();
</script>
