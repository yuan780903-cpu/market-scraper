<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="客戶戰情室">
<meta name="theme-color" content="#36421f">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>客戶戰情室</title>
<style>
  :root{
    /* 軍事迷彩 戰情室 配色 */
    --green:#556b2f; --green-d:#3c4d20; --green-l:#eceedd;   /* 橄欖綠 olive drab */
    --amber:#c4811b; --amber-l:#f9edd3; --red:#a3331f; --red-l:#f5e0da;
    --blue:#41607240; --blue-l:#dfe9ed; --gray:#5d6651; --gray-l:#e7e6da;
    --bg:#ddd9c7; --card:#fffdf5; --ink:#23271c; --muted:#6a6e57; --line:#cfccb8;
    --tan:#b9ad84; --steel:#41606f; --olive:#556b2f; --olive-d:#3c4d20;
    --camo-dk:#36421f; --camo-dk2:#2a3318; --camo-lt:#46562b;
    --shadow:0 2px 6px rgba(30,35,18,.14),0 1px 2px rgba(30,35,18,.08);
  }
  /* 修正 --blue 誤值 */
  :root{ --blue:#416072; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,"PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    color:var(--ink);font-size:15px;line-height:1.5;
    padding-bottom:env(safe-area-inset-bottom);-webkit-text-size-adjust:100%;
    background-color:#dad6c3;
    background-image:
      repeating-linear-gradient(0deg,rgba(90,100,60,.05) 0 1px,transparent 1px 38px),
      repeating-linear-gradient(90deg,rgba(90,100,60,.05) 0 1px,transparent 1px 38px),
      radial-gradient(circle at 20px 26px,rgba(120,128,86,.22) 0 20px,transparent 23px),
      radial-gradient(circle at 100px 72px,rgba(150,140,100,.20) 0 24px,transparent 27px),
      radial-gradient(circle at 60px 124px,rgba(90,100,60,.18) 0 22px,transparent 25px),
      radial-gradient(circle at 146px 30px,rgba(120,128,86,.16) 0 18px,transparent 21px);
    background-size:auto,auto,180px 168px,180px 168px,180px 168px,180px 168px;
  }
  /* 戰情室抬頭 — 迷彩 + 字幕條 */
  .topbar{position:sticky;top:0;z-index:30;
    background-color:var(--camo-dk);
    background-image:
      radial-gradient(circle at 22px 16px,var(--camo-dk2) 0 16px,transparent 18px),
      radial-gradient(circle at 84px 30px,var(--camo-lt) 0 18px,transparent 20px),
      radial-gradient(circle at 138px 14px,#212a14 0 15px,transparent 17px),
      radial-gradient(circle at 52px 46px,var(--camo-lt) 0 14px,transparent 16px),
      radial-gradient(circle at 158px 48px,var(--camo-dk2) 0 16px,transparent 18px);
    background-size:180px 64px;
    color:#f2efde;padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top));
    box-shadow:var(--shadow);display:flex;align-items:center;gap:10px;border-bottom:2px solid #1f2613}
  .topbar h1{font-size:18px;margin:0;font-weight:800;flex:1;letter-spacing:1px;text-shadow:0 1px 2px rgba(0,0,0,.45)}
  .topbar .leaf{font-size:22px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.4))}
  /* 作戰單位指揮格 */
  .cmd-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:2px 0 6px}
  .unit{position:relative;border:0;border-radius:14px;padding:14px 7px 11px;cursor:pointer;font-family:inherit;
    color:#f4f1e2;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;overflow:hidden;
    background:linear-gradient(150deg,#56682f,#33401d);box-shadow:var(--shadow);border:1px solid #2a3318}
  .unit::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.45;
    background-image:
      radial-gradient(circle at 16px 14px,rgba(0,0,0,.35) 0 12px,transparent 14px),
      radial-gradient(circle at 70px 40px,rgba(255,255,255,.10) 0 14px,transparent 16px),
      radial-gradient(circle at 40px 70px,rgba(0,0,0,.30) 0 12px,transparent 14px);
    background-size:90px 84px}
  .unit::after{content:"";position:absolute;top:7px;left:7px;width:10px;height:10px;
    border-top:2px solid rgba(255,255,255,.45);border-left:2px solid rgba(255,255,255,.45)}
  .unit:active{transform:scale(.97)}
  .unit .u-ic{width:40px;height:40px;display:flex;align-items:center;justify-content:center;z-index:1;margin-bottom:1px}
  .unit .u-ic svg{width:36px;height:36px}
  .unit .u-code{font-size:9px;letter-spacing:2px;font-weight:800;color:#d7dcab;z-index:1}
  .unit .u-label{font-size:14.5px;font-weight:800;z-index:1;line-height:1.2}
  .unit .u-desc{font-size:10.5px;color:#dfe2c8;z-index:1;margin-top:1px}
  /* 各頁 作戰單位抬頭卡 */
  .unit-hd{display:flex;align-items:center;gap:12px;border-radius:14px;padding:11px 14px;margin-bottom:13px;
    color:#f4f1e2;position:relative;overflow:hidden;border:1px solid #2a3318;box-shadow:var(--shadow);
    background:linear-gradient(135deg,#56682f,#33401d)}
  .unit-hd::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.42;
    background-image:
      radial-gradient(circle at 22px 14px,rgba(0,0,0,.35) 0 14px,transparent 16px),
      radial-gradient(circle at 96px 44px,rgba(255,255,255,.10) 0 16px,transparent 18px),
      radial-gradient(circle at 160px 12px,rgba(0,0,0,.30) 0 12px,transparent 14px),
      radial-gradient(circle at 220px 40px,rgba(255,255,255,.08) 0 14px,transparent 16px);
    background-size:260px 70px}
  .unit-hd::after{content:"";position:absolute;top:7px;right:8px;width:11px;height:11px;
    border-top:2px solid rgba(255,255,255,.42);border-right:2px solid rgba(255,255,255,.42)}
  .uh-ic{width:46px;height:46px;flex:none;display:flex;align-items:center;justify-content:center;z-index:1;
    background:rgba(0,0,0,.20);border:1px solid rgba(255,255,255,.28);border-radius:12px}
  .uh-ic svg{width:30px;height:30px}
  .uh-t{z-index:1;flex:1;min-width:0}
  .uh-code{font-size:9.5px;letter-spacing:2.5px;font-weight:800;color:#d7dcab}
  .uh-title{font-size:18px;font-weight:800;line-height:1.18}
  .uh-desc{font-size:11px;color:#dfe2c8;margin-top:1px}
  /* 品牌標誌（碩成肥料）*/
  .brand-logo{flex:none;display:flex;align-items:center}
  .brand-logo svg{height:38px;width:auto;display:block;filter:drop-shadow(0 1px 2px rgba(0,0,0,.45))}
  .brand-txt{display:flex;flex-direction:column;line-height:1.12;flex:1;min-width:0}
  .brand-name{font-size:10.5px;letter-spacing:3px;color:#cdd6a8;font-weight:700}
  main{padding:14px 14px 28px;max-width:760px;margin:0 auto}
  /* 回首頁按鈕（取代底部導覽列）*/
  .uh-home{margin-left:auto;z-index:1;flex:none;display:flex;align-items:center;justify-content:center;gap:5px;
    background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.30);color:#f4f1e2;
    border-radius:11px;padding:9px 12px;font-size:12.5px;font-weight:800;font-family:inherit;cursor:pointer}
  .uh-home:active{transform:scale(.95)}
  /* nav（已停用，改用首頁卡片導覽）*/
  .nav{display:none !important}
  .nav-x{position:fixed;bottom:0;left:0;right:0;z-index:40;background:#2b3320;
    border-top:2px solid #1f2613;display:flex;
    padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -2px 12px rgba(0,0,0,.25)}
  .nav button{flex:1;border:0;background:none;padding:8px 1px 10px;font-size:10px;
    color:#9aa580;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;font-family:inherit;white-space:nowrap}
  .nav button .ic{font-size:20px;line-height:1}
  .nav button.on{color:#e3b341;font-weight:800}
  .nav button.on .ic{transform:translateY(-1px)}
  /* cards */
  .card{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:14px;margin-bottom:12px;border:1px solid var(--line)}
  .stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:4px}
  .stat{border-radius:14px;padding:14px;color:#fff;position:relative;overflow:hidden;border:1px solid rgba(0,0,0,.18)}
  .stat::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.30;
    background-image:radial-gradient(circle at 14px 12px,rgba(0,0,0,.35) 0 12px,transparent 14px),radial-gradient(circle at 64px 44px,rgba(255,255,255,.12) 0 14px,transparent 16px);
    background-size:90px 80px}
  .stat .n{font-size:28px;font-weight:800;line-height:1;position:relative;z-index:1}
  .stat .l{font-size:12.5px;opacity:.96;margin-top:4px;position:relative;z-index:1}
  .stat.due{background:linear-gradient(135deg,#c8862a,#a5681a)}
  .stat.over{background:linear-gradient(135deg,#b0432c,#822c1a)}
  .stat.cust{background:linear-gradient(135deg,#6b7f3a,#465a24)}
  .stat.prosp{background:linear-gradient(135deg,#4a6072,#2f4453)}
  .sec-title{font-size:14px;font-weight:800;color:var(--ink);margin:18px 2px 9px;display:flex;align-items:center;gap:7px;letter-spacing:.4px}
  .sec-title .bar{width:5px;height:15px;background:var(--olive);border-radius:2px;box-shadow:2px 0 0 #e3b341}
  /* list item */
  .item{display:flex;gap:11px;align-items:flex-start;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
  .item:last-child{border-bottom:0}
  .avatar{width:42px;height:42px;border-radius:11px;flex:none;display:flex;align-items:center;justify-content:center;
    font-size:18px;font-weight:700;color:#fff}
  .item .body{flex:1;min-width:0}
  .item .nm{font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item .sub{color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
  .item .meta{text-align:right;flex:none;font-size:11px;color:var(--muted)}
  .badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;font-weight:700;white-space:nowrap}
  .b-農會{background:var(--blue-l);color:var(--blue)}
  .b-合作社{background:var(--green-l);color:var(--green)}
  .b-肥料行{background:#f3e5f5;color:#7b1fa2}
  .b-有機農戶{background:#e0f2f1;color:#00897b}
  .b-經銷商{background:#fff3e0;color:#ef6c00}
  .b-直接農民{background:#f1f8e9;color:#558b2f}
  .b-競爭對手{background:var(--red-l);color:var(--red)}
  .b-驗證機構,.b-友善團體,.b-有機促進區,.b-其他{background:var(--gray-l);color:var(--gray)}
  .fitem{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
  .fitem:last-child{border-bottom:none}
  .fitem input[type=checkbox]{width:20px;height:20px;margin-top:1px;flex:none}
  .fitem .ftext{flex:1;font-size:14px;line-height:1.5}
  .fitem.done .ftext{text-decoration:line-through;color:var(--muted)}
  .fdue{font-size:12px;color:var(--muted);margin-top:2px}
  .fdue.over{color:var(--red);font-weight:700}
  .fdel{background:none;border:none;color:var(--muted);font-size:14px;cursor:pointer;flex:none;padding:0 2px}
  .rcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 13px;margin-bottom:10px}
  .rcard-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;font-size:14px}
  .rule-del{background:none;border:none;color:var(--red);font-size:13px;font-family:inherit;cursor:pointer;padding:2px 4px}
  /* 戰情地圖 */
  .mapwrap{position:relative;width:100%;background:#d8ecfb;border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .mapwrap svg{display:block;width:100%;height:auto;touch-action:pinch-zoom}
  .tw-town{stroke:#fff;stroke-width:0.5;cursor:pointer}
  .tw-town.sel{stroke:#0d47a1;stroke-width:2.4}
  .maplegend{display:flex;flex-wrap:wrap;gap:6px 12px;margin:10px 2px;font-size:12px;color:var(--muted)}
  .maplegend span{display:inline-flex;align-items:center;gap:5px}
  .maplegend i{width:14px;height:14px;border-radius:3px;display:inline-block;border:1px solid rgba(0,0,0,.08)}
  .minfo{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
  .minfo .mt{font-size:16px;font-weight:700;margin-bottom:6px}
  .minfo .mstat{display:flex;gap:18px;font-size:14px}
  .minfo .mstat b{font-size:20px}
  .mrow{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}
  .mrow:last-child{border-bottom:none}
  .mname{width:78px;font-size:13px;font-weight:600;flex:none}
  .mbar{flex:1;height:9px;border-radius:5px;background:#eceff1;overflow:hidden}
  .mbar>i{display:block;height:100%}
  .mnum{font-size:12px;color:var(--muted);width:104px;text-align:right;flex:none}
  /* LINE 內建瀏覽器警告 */
  #inapp-warn{position:fixed;top:0;left:0;right:0;z-index:200;background:#b71c1c;color:#fff;
    padding:12px 14px;font-size:13px;line-height:1.6;box-shadow:0 2px 8px rgba(0,0,0,.3)}
  #inapp-warn b{color:#ffeb3b}
  #inapp-warn .wbtns{margin-top:8px;display:flex;gap:8px}
  #inapp-warn button{flex:1;border:0;border-radius:8px;padding:8px 6px;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer}
  #inapp-warn .wcopy{background:#fff;color:#b71c1c}
  #inapp-warn .wok{background:rgba(255,255,255,.25);color:#fff}
  .grade-A{background:#fdecea;color:#c62828}
  .grade-B{background:#fff3e0;color:#ef6c00}
  .grade-C{background:#e8f5e9;color:#2e7d32}
  .grade-D{background:#eceff1;color:#546e7a}
  .pill-due{background:var(--amber-l);color:var(--amber)}
  .pill-over{background:var(--red-l);color:var(--red)}
  .pill-ok{background:var(--green-l);color:var(--green)}
  /* search & filter */
  .search{display:flex;gap:8px;margin-bottom:10px}
  .search input{flex:1;border:1px solid var(--line);border-radius:11px;padding:11px 13px;font-size:15px;font-family:inherit;background:#fff}
  .search input:focus{outline:none;border-color:var(--green)}
  .chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px;-webkit-overflow-scrolling:touch}
  .chips::-webkit-scrollbar{display:none}
  .chip{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:20px;
    padding:6px 13px;font-size:13px;white-space:nowrap;cursor:pointer;font-family:inherit;flex:none}
  .chip.on{background:var(--green);color:#fff;border-color:var(--green);font-weight:700}
  .seg{display:flex;gap:8px;margin-bottom:12px}
  .seg-b{flex:1;padding:11px 8px;border:1px solid var(--line);border-radius:11px;background:#fff;font-size:13.5px;font-weight:600;color:var(--muted);font-family:inherit;cursor:pointer}
  .seg-b.on{background:var(--green);color:#fff;border-color:var(--green)}
  .wdays{display:flex;flex-wrap:wrap;gap:6px}
  .rowsel{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .rowsel-l{font-size:12px;font-weight:700;color:var(--muted);flex:none;min-width:32px;white-space:nowrap}
  .rowsel .chips{margin-bottom:0;flex:1}
  /* 戰情公仔 */
  .soldier-card{text-align:center;background:linear-gradient(180deg,#f3f4e6,#fffdf5)}
  .doll-wrap{position:relative;width:148px;margin:2px auto 4px;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none}
  .doll-wrap svg{display:block;width:100%;height:auto;transform-origin:50% 92%;animation:dollBob 3.2s ease-in-out infinite;filter:drop-shadow(0 4px 6px rgba(0,0,0,.15))}
  @keyframes dollBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .doll-wrap.pet svg{animation:dollPet .66s ease}
  @keyframes dollPet{0%{transform:translateY(0) rotate(0) scale(1)}20%{transform:translateY(-9px) rotate(-7deg) scale(1.07)}45%{transform:translateY(2px) rotate(6deg) scale(1.05)}70%{transform:translateY(-3px) rotate(-3deg) scale(1.05)}100%{transform:translateY(0) rotate(0) scale(1)}}
  .doll-bubble{position:absolute;top:-4px;left:50%;transform:translateX(-50%) scale(.6);background:#fff;border:2px solid var(--green);color:#2a2f22;font-size:12px;font-weight:800;padding:5px 11px;border-radius:14px;white-space:nowrap;opacity:0;pointer-events:none;box-shadow:0 3px 10px rgba(0,0,0,.18);z-index:4}
  .doll-bubble.show{animation:bubPop 1.9s ease forwards}
  @keyframes bubPop{0%{opacity:0;transform:translateX(-50%) translateY(8px) scale(.6)}12%{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}80%{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}100%{opacity:0;transform:translateX(-50%) translateY(-6px) scale(1)}}
  .doll-fx{position:absolute;inset:0;pointer-events:none;overflow:visible;z-index:3}
  .fxp{position:absolute;top:42%;font-size:19px;will-change:transform,opacity;animation:fxFloat 1.1s ease-out forwards}
  @keyframes fxFloat{0%{opacity:0;transform:translateY(0) scale(.5)}25%{opacity:1}100%{opacity:0;transform:translateY(-66px) scale(1.25)}}
  .sol-name{font-size:16px;font-weight:900;color:var(--ink);margin-top:2px}
  .sol-tags{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:6px}
  .sol-badge{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:800;color:#fff;padding:3px 9px;border-radius:11px;background:#7a7a6a}
  .sol-badge.wpn{background:#8a5a2a}.sol-badge.reg{background:#456}
  .sol-hint{font-size:11.5px;color:var(--muted);margin-top:8px}
  .sol-link{color:var(--green);font-weight:800;cursor:pointer;text-decoration:underline}
  .regsel{flex:1;border:1px solid var(--line);border-radius:11px;padding:9px 12px;font-size:15px;font-family:inherit;background:#fff;color:var(--ink)}
  .regsel:focus{outline:none;border-color:var(--green)}
  /* buttons */
  .btn{border:0;border-radius:11px;padding:12px 16px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;
    display:inline-flex;align-items:center;justify-content:center;gap:6px}
  .btn-pri{background:var(--green);color:#fff;width:100%}
  .btn-pri:active{background:var(--green-d)}
  .btn-out{background:#fff;color:var(--green);border:1.5px solid var(--green)}
  .btn-gray{background:var(--gray-l);color:var(--ink)}
  .btn-red{background:var(--red-l);color:var(--red)}
  .btn-row{display:flex;gap:9px;margin-top:10px}
  .btn-row .btn{flex:1}
  .fab{position:fixed;right:18px;bottom:22px;bottom:calc(22px + env(safe-area-inset-bottom));z-index:35;
    width:56px;height:56px;border-radius:50%;background:var(--green);color:#fff;border:0;font-size:30px;
    box-shadow:0 4px 14px rgba(46,125,50,.45);cursor:pointer;line-height:1}
  /* modal */
  .modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center}
  .modal.show{display:flex}
  .sheet{background:#fff;width:100%;max-width:760px;max-height:92vh;border-radius:20px 20px 0 0;
    overflow-y:auto;-webkit-overflow-scrolling:touch;animation:up .25s ease}
  @keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:translateY(0);opacity:1}}
  .sheet-h{position:sticky;top:0;background:#fff;padding:15px 16px;border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:10px;z-index:2}
  .sheet-h h2{font-size:17px;margin:0;flex:1;font-weight:800}
  .sheet-h .x{background:var(--gray-l);border:0;width:32px;height:32px;border-radius:50%;font-size:18px;cursor:pointer;color:var(--ink)}
  .sheet-b{padding:16px}
  .grab{width:38px;height:4px;background:#d6ddd7;border-radius:3px;margin:8px auto 0}
  /* form */
  .field{margin-bottom:13px}
  .field label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:5px}
  .field label .req{color:var(--red)}
  .field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;
    padding:11px 12px;font-size:15px;font-family:inherit;background:#fff;color:var(--ink)}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--green)}
  .field textarea{resize:vertical;min-height:62px}
  .field .hint{font-size:11px;color:var(--muted);margin-top:4px}
  .field-2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  .fset{border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:13px}
  .fset legend{font-size:12.5px;font-weight:800;color:var(--green);padding:0 6px}
  .fset.sens{border-color:#f4c7c7;background:#fffafa}
  .fset.sens legend{color:var(--red)}
  /* 產品報價列 */
  .prow{border:1px solid var(--line);border-radius:10px;padding:9px;margin-bottom:9px;background:#fafdfb}
  .prow .pp-name{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 10px;font-size:14px;font-family:inherit;background:#fff;margin-bottom:7px}
  .prow-2{display:grid;grid-template-columns:1.1fr 1fr 1fr 1.1fr auto;gap:6px;align-items:center}
  .prow-2 select,.prow-2 input{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 6px;font-size:13px;font-family:inherit;background:#fff;min-width:0}
  .prow-del{border:none;background:#fde8e8;color:var(--red);border-radius:9px;width:34px;height:34px;font-size:15px;cursor:pointer;flex:none}
  /* detail */
  .drow{display:flex;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
  .drow:last-child{border-bottom:0}
  .drow .k{width:88px;flex:none;color:var(--muted);font-size:13px}
  .drow .v{flex:1;font-weight:600;word-break:break-all}
  .drow .v a{color:var(--blue);text-decoration:none}
  .timeline{margin-top:6px}
  .tl{padding:10px 12px;background:var(--green-l);border-radius:10px;margin-bottom:8px;border-left:3px solid var(--green)}
  .tl .tl-h{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:3px}
  .tl .tl-c{font-size:14px}
  .empty{text-align:center;color:var(--muted);padding:40px 20px;font-size:14px}
  .empty .big{font-size:46px;margin-bottom:8px}
  .more{text-align:center;padding:12px;color:var(--green);font-weight:700;cursor:pointer;font-size:14px}
  .toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:#323232;color:#fff;
    padding:11px 18px;border-radius:24px;font-size:14px;z-index:99;opacity:0;transition:opacity .25s;pointer-events:none;box-shadow:var(--shadow)}
  .toast.show{opacity:1}
  .count{font-size:12.5px;color:var(--muted);margin:2px 2px 8px}
  .tagline{font-size:11px;color:var(--muted)}
  .info{background:var(--blue-l);color:var(--blue);border-radius:10px;padding:11px 13px;font-size:12.5px;margin-bottom:12px;line-height:1.6}
</style>
