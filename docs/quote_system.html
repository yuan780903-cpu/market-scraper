<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>碩成牌有機質肥料 — 報價單系統</title>
<style>
  :root{ --green:#2e7d32; --line:#222; --soft:#e8f0e9; }
  *{ box-sizing:border-box; }
  html,body{ max-width:100%; overflow-x:hidden; }
  body{ margin:0; font-family:"PingFang TC","Microsoft JhengHei",sans-serif; background:#f4f4f0; color:#1a1a1a; }
  .app{ display:grid; grid-template-columns:420px 1fr; gap:18px; padding:18px; max-width:1400px; margin:0 auto; }
  h1{ font-size:18px; margin:0 0 4px; }
  .panel{ background:#fff; border:1px solid #ddd; border-radius:10px; padding:16px; }
  .panel h2{ font-size:14px; color:var(--green); margin:0 0 10px; border-bottom:2px solid var(--soft); padding-bottom:6px; }
  label{ display:block; font-size:12px; color:#555; margin:8px 0 3px; }
  input,select,textarea{ width:100%; padding:7px 8px; border:1px solid #ccc; border-radius:6px; font-size:13px; font-family:inherit; }
  textarea{ resize:vertical; min-height:64px; }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .btn{ border:none; border-radius:7px; padding:9px 14px; font-size:13px; cursor:pointer; font-family:inherit; }
  .btn-primary{ background:var(--green); color:#fff; }
  .btn-ghost{ background:#eee; color:#333; }
  .btn-danger{ background:#fbe9e7; color:#c62828; }
  .toolbar{ display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  table.items{ width:100%; border-collapse:collapse; margin-top:6px; font-size:12px; }
  table.items th,table.items td{ border:1px solid #ddd; padding:4px; }
  table.items th{ background:var(--soft); font-weight:600; }
  table.items input,table.items select{ padding:4px; font-size:12px; }
  .additem{ margin-top:8px; }
  .hint{ font-size:11px; color:#888; margin-top:4px; }

  /* ===== 預覽 / 列印區 ===== */
  .preview-wrap{ overflow:auto; }
  .sheet{ background:#fff; width:794px; min-height:auto; margin:0 auto; padding:34px 44px 38px; border:1px solid #ccc;
          font-size:13px; color:#000; box-shadow:0 2px 10px rgba(0,0,0,.08);
          font-family:"DFKai-SB","BiauKai","標楷體","KaiTi","PingFang TC","Microsoft JhengHei",serif; }
  .letterhead{ display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
  .letterhead img{ height:46px; }
  .letterhead .lh-co{ font-size:13px; color:#444; text-align:right; line-height:1.5; }
  .sheet .title{ text-align:center; font-size:26px; letter-spacing:10px; font-weight:700; margin:2px 0 14px; }
  .brandline{ display:flex; align-items:center; justify-content:center; gap:12px; margin-bottom:16px; }
  .brand-badge{ height:40px; }
  .brand-name{ font-size:18px; font-weight:700; letter-spacing:5px; color:var(--green); }
  .brand-date{ font-size:13px; margin-left:16px; color:#222; }
  table.info{ width:100%; border-collapse:collapse; margin-bottom:14px; }
  table.info td{ border:1px solid var(--line); padding:6px 9px; font-size:13px; }
  table.info .lbl{ background:#f3f3f3; width:84px; white-space:nowrap; font-weight:600; }
  table.quote{ width:100%; border-collapse:collapse; margin-bottom:16px; table-layout:fixed; }
  table.quote th,table.quote td{ border:1px solid var(--line); padding:6px 6px; font-size:13px; text-align:center; word-break:break-word; }
  table.quote th{ background:#f3f3f3; }
  table.quote td.name{ text-align:left; }
  .notes{ margin:14px 0; }
  .notes .nt-title{ font-size:13px; font-weight:700; margin-bottom:4px; }
  .notes ol{ margin:0; padding-left:24px; font-size:11.5px; line-height:1.6; list-style:cjk-ideographic; }
  .notes ol li{ padding-left:2px; }
  .cardfoot{ margin-top:28px; text-align:left; }
  .cardfoot img{ display:block; max-width:220px; width:auto; height:auto; margin:0; border:1px solid #eee; }
  .cardfoot .missing{ color:#c62828; font-size:13px; padding:20px; border:1px dashed #c62828; border-radius:8px; }

  @media print{
    body{ background:#fff; }
    .app{ display:block; padding:0; max-width:none; }
    .controls{ display:none !important; }
    .preview-wrap{ overflow:visible; height:auto !important; }
    .sheet{ box-shadow:none; border:none; margin:0; width:auto; min-height:auto; padding:0; transform:none !important; }
    @page{ size:A4; margin:14mm; }
  }

  /* ===== 手機版（窄螢幕）===== */
  @media (max-width:860px){
    .app{ grid-template-columns:1fr; gap:12px; padding:10px; min-width:0; }
    .controls, .preview-wrap{ min-width:0; }
    .controls .panel{ padding:12px; }
    .toolbar .btn{ flex:1 1 auto; }
    .preview-wrap{ border:1px solid #ddd; border-radius:10px; background:#fafafa; padding:6px; overflow-x:auto; max-width:100%; }
    .sheet{ transform-origin:top left; }   /* 實際縮放比例由 JS 計算 */
  }
</style>
</head>
<body>
<div class="app">
  <!-- ============ 控制面板 ============ -->
  <div class="controls">
    <div class="panel">
      <h1>碩成牌有機質肥料 · 報價單系統</h1>
      <div class="hint" id="pdfHint">資料只存在本機瀏覽器（不上雲）。填完按「下載 PDF」即可存檔。</div>
      <div class="toolbar">
        <button class="btn btn-primary" onclick="savePDF()">下載 PDF</button>
        <button class="btn btn-ghost" onclick="saveDraft()">儲存草稿</button>
        <button class="btn btn-ghost" onclick="loadDraft()">讀取草稿</button>
        <button class="btn btn-ghost" onclick="clearCustomer()">清空客戶</button>
      </div>
    </div>

    <div class="panel" style="margin-top:14px;">
      <h2>客戶資料</h2>
      <label>報價日期（民國）</label>
      <input id="qdate" placeholder="例 114.06.30">
      <label>公司名稱</label>
      <input id="c_company" oninput="render()" placeholder="麻豆區農會供銷部">
      <div class="row2">
        <div><label>統一編號</label><input id="c_tax" oninput="render()" placeholder="06664166"></div>
        <div><label>客戶名稱 / 聯絡人</label><input id="c_name" oninput="render()" placeholder="吳春冷主任"></div>
      </div>
      <label>地址</label>
      <input id="c_addr" oninput="render()" placeholder="721臺南市麻豆區新生北路56號">
      <div class="row2">
        <div><label>聯絡電話</label><input id="c_phone" oninput="render()" placeholder="0912-793-895"></div>
        <div><label>傳真</label><input id="c_fax" oninput="render()" placeholder="06-571-5790"></div>
      </div>
    </div>

    <div class="panel" style="margin-top:14px;">
      <h2>報價項目</h2>
      <div class="row2">
        <div><label>價格欄①標題</label><input id="col1" value="農會進價" oninput="render()"></div>
        <div><label>價格欄②標題</label><input id="col2" value="末端售價" oninput="render()"></div>
      </div>
      <table class="items">
        <thead>
          <tr><th>產品</th><th>型態</th><th>規格kg</th><th>價①</th><th>價②</th><th></th></tr>
        </thead>
        <tbody id="itemBody"></tbody>
      </table>
      <button class="btn btn-ghost additem" onclick="addItem()">＋ 新增一列</button>
      <div class="hint">粒狀固定 20kg；粉狀可選 20/25/500/1000。選產品自動帶入登記全名。</div>
    </div>

    <div class="panel" style="margin-top:14px;">
      <h2>備註</h2>
      <textarea id="notes" oninput="render()"></textarea>
      <div class="hint">每行一條，會自動編號。登記證號依產品調整。</div>
    </div>

    <div class="panel" style="margin-top:14px;">
      <h2>落款 · 業務名片</h2>
      <input type="file" accept="image/*" id="cardFile" onchange="uploadCard(event)" style="font-size:12px">
      <div class="toolbar">
        <button class="btn btn-ghost" onclick="document.getElementById('cardFile').click()">選擇 / 拍照名片</button>
        <button class="btn btn-danger" onclick="removeCard()">移除名片</button>
      </div>
      <div class="hint">選一次就好，名片圖只存在本機（手機/電腦），每張報價單最下方都會原樣顯示。</div>
    </div>
  </div>

  <!-- ============ 預覽 / 列印 ============ -->
  <div class="preview-wrap">
    <div class="sheet" id="sheet"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.2/dist/html2pdf.bundle.min.js"></script>
<script>
/* ===== 9 項正式品名（依肥料登記證，記憶 line_bot_business_rules）===== */
const PRODUCTS = [
  { short:"碩成508",    full:"碩成508有機質肥料" },
  { short:"碩成1號+",   full:"碩成有機質肥料1號+" },
  { short:"碩成2號",    full:"碩成有機質肥料2號" },
  { short:"碩成2號+",   full:"碩成有機質肥料2號+" },
  { short:"碩成生技1號", full:"碩成生技有機質肥料1號" },
  { short:"碩成果美肥",  full:"碩成果美有機質肥料" },
  { short:"碩成基肥1號", full:"碩成基肥有機質肥料1號" },
  { short:"碩成基肥2號", full:"碩成基肥有機質肥料2號" },
  { short:"碩成基肥2號+", full:"碩成基肥有機質肥料2號+" },
];
const POWDER_SPECS = ["20","25","500","1000"];

const DEFAULT_NOTES =
`此產品肥料品目為 5-09，肥料登記證號肥製(質)字 0237008 號
符合農糧署國產有機質肥料品牌2+2補助推薦名單
本報價為含運價`;

let items = [];

/* ----- 民國日期 ----- */
function todayROC(){
  const d=new Date();
  const y=d.getFullYear()-1911;
  const m=String(d.getMonth()+1).padStart(2,"0");
  const day=String(d.getDate()).padStart(2,"0");
  return `${y}.${m}.${day}`;
}

/* ----- 項目列 ----- */
function addItem(p){
  p = p || { product:"碩成2號", form:"粉狀", spec:"25", price1:"", price2:"" };
  items.push(p);
  renderItemRows();
  render();
}
function delItem(i){ items.splice(i,1); renderItemRows(); render(); }

function renderItemRows(){
  const tb=document.getElementById("itemBody");
  tb.innerHTML="";
  items.forEach((it,i)=>{
    const tr=document.createElement("tr");
    const prodOpts=PRODUCTS.map(p=>`<option ${p.short===it.product?"selected":""}>${p.short}</option>`).join("");
    const specOpts=(it.form==="粒狀"?["20"]:POWDER_SPECS)
        .map(s=>`<option ${s===it.spec?"selected":""}>${s}</option>`).join("");
    tr.innerHTML=`
      <td><select onchange="upd(${i},'product',this.value)">${prodOpts}</select></td>
      <td><select onchange="updForm(${i},this.value)">
            <option ${it.form==="粒狀"?"selected":""}>粒狀</option>
            <option ${it.form==="粉狀"?"selected":""}>粉狀</option>
          </select></td>
      <td><select onchange="upd(${i},'spec',this.value)" ${it.form==="粒狀"?"disabled":""}>${specOpts}</select></td>
      <td><input value="${it.price1||""}" oninput="upd(${i},'price1',this.value)" style="width:54px"></td>
      <td><input value="${it.price2||""}" oninput="upd(${i},'price2',this.value)" style="width:54px"></td>
      <td><button class="btn btn-danger" style="padding:3px 7px" onclick="delItem(${i})">×</button></td>`;
    tb.appendChild(tr);
  });
}
function upd(i,k,v){ items[i][k]=v; render(); }
function updForm(i,v){
  items[i].form=v;
  if(v==="粒狀") items[i].spec="20";
  renderItemRows(); render();
}

/* ----- 工具 ----- */
function val(id){ return document.getElementById(id).value.trim(); }
function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function fullName(short){ const p=PRODUCTS.find(x=>x.short===short); return p?p.full:short; }

/* ----- 渲染報價單 ----- */
function render(){
  const date=val("qdate")||todayROC();
  const col1=esc(val("col1")||"進價"), col2=esc(val("col2")||"售價");

  const rows=items.map((it,i)=>{
    const spec=it.form==="粒狀"?"20":it.spec;
    const name=`${fullName(it.product)}（${it.form}）`;
    const p1=it.price1?`$${esc(it.price1)} 元`:"—";
    const p2=it.price2?`$${esc(it.price2)} 元`:"—";
    return `<tr><td>${i+1}</td><td class="name">${esc(name)}</td><td>${spec}KG</td><td>${p1}</td><td>${p2}</td></tr>`;
  }).join("") || `<tr><td colspan="5" style="color:#999">（尚未新增報價項目）</td></tr>`;

  const noteLines=val("notes").split("\n").map(s=>s.trim()).filter(Boolean);
  const notesHtml=noteLines.map(n=>`<li>${esc(n)}</li>`).join("");

  const card=getCard();
  const cardHtml = card
    ? `<img src="${card}" alt="名片">`
    : `<span class="missing">尚未上傳名片 — 點左側「選擇 / 拍照名片」（圖片僅存本機）</span>`;

/* ----- 名片（只存本機）----- */
function getCard(){ return localStorage.getItem("ss_card"); }
function uploadCard(e){
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{ localStorage.setItem("ss_card", r.result); render(); }
                catch(err){ alert("圖片太大無法存入，請用較小的名片圖。"); } };
  r.readAsDataURL(f);
}
function removeCard(){ localStorage.removeItem("ss_card"); document.getElementById("cardFile").value=""; render(); }

/* ----- 手機自動縮放報價單預覽 ----- */
function scaleSheet(){
  const wrap=document.querySelector(".preview-wrap");
  const sheet=document.getElementById("sheet");
  if(!wrap||!sheet) return;
  // 取最可靠的「最窄」可用寬度，避免 iOS/LINE 內建瀏覽器初次回報過寬導致不縮放
  const vv=window.visualViewport ? window.visualViewport.width : window.innerWidth;
  const avail=Math.min(wrap.clientWidth, document.documentElement.clientWidth, vv)-2;
  const scale=Math.min(1, avail/794);
  // iOS/LINE 的 WebKit：zoom 只是「視覺」縮放，版面盒仍停在原尺寸(794×670)，
  // 外框量到的高度還是 670 → 報價單下方留一大片空白 + 一條殘邊線。Blink 不會，
  // 所以桌機測不出來。解法：用 transform:scale 做視覺縮放，再「手動」把外框高度
  // 設成『縮放後高度＋自身 padding/border』並 overflow:hidden 裁掉原尺寸空盒。
  sheet.style.zoom="";
  sheet.style.transformOrigin="top left";
  if(scale<1){
    sheet.style.transform="scale("+scale+")";
    const cs=getComputedStyle(wrap);
    const extra=parseFloat(cs.paddingTop)+parseFloat(cs.paddingBottom)
               +parseFloat(cs.borderTopWidth)+parseFloat(cs.borderBottomWidth);
    wrap.style.height=(sheet.offsetHeight*scale+extra)+"px";
    wrap.style.overflow="hidden";
  }else{
    sheet.style.transform="none";
    wrap.style.height="";
    wrap.style.overflow="";
  }
}
window.addEventListener("resize", scaleSheet);
window.addEventListener("orientationchange", scaleSheet);
window.addEventListener("load", scaleSheet);
if(window.visualViewport){ window.visualViewport.addEventListener("resize", scaleSheet); }
if(document.fonts&&document.fonts.ready){ document.fonts.ready.then(scaleSheet); }
// 多跑幾次補正 iOS 初次 layout 還沒定案的情況
[100,400,900].forEach(function(t){ setTimeout(scaleSheet, t); });

/* ----- 下載 / 開啟 PDF -----
   LINE 等 App 內建瀏覽器無法「下載」檔案(尤其 iPhone)，
   所以在 App 內改成「開啟 PDF 檢視」→ 使用者再用 iOS 分享鈕存檔/傳送。
   一般 Safari/Chrome 則直接下載。 */
function isInApp(){
  const ua=navigator.userAgent||"";
  return /\bLine\//i.test(ua) || /FBAN|FBAV|Instagram|micromessenger/i.test(ua);
}
function savePDF(){
  const sheet=document.getElementById("sheet");
  if(typeof html2pdf==="undefined"){ window.print(); return; }
  const inApp=isInApp();
  // App 內：先在點擊手勢中同步開好新分頁，避免被當彈窗擋掉
  let win=null;
  if(inApp){ win=window.open("","_blank"); }
  // 暫時取消縮放(zoom)與固定頁高，量出報價單實際 1:1 像素尺寸
  const prevZ=sheet.style.zoom, prevT=sheet.style.transform, prevMH=sheet.style.minHeight;
  sheet.style.zoom="";
  sheet.style.transform="none";
  sheet.style.minHeight="auto";
  // 用報價單「實際寬高」當 PDF 頁面大小(單位 px)，讓畫面 1:1 對應頁面，
  // 不再經過 A4 縮放那一步 → 右邊絕不會被切、也不會多一頁空白(與裝置 DPR 無關)。
  const W=sheet.offsetWidth;
  const H=sheet.offsetHeight+2;
  // jsPDF 會依 orientation 強制長邊當高/寬而對調尺寸，導致頁面比內容窄、右邊被切。
  // 依實際長寬決定方向，確保頁面剛好是 W×H、報價單 1:1 填滿、絕不裁切。
  const orient = W>H ? "landscape" : "portrait";
  const cust=val("c_company")||val("c_name")||"客戶";
  const fname=cust+"報價單.pdf";
  const restore=()=>{ sheet.style.zoom=prevZ; sheet.style.transform=prevT; sheet.style.minHeight=prevMH; scaleSheet(); };
  html2pdf().set({
    margin:0,
    filename:fname,
    image:{type:"jpeg",quality:0.96},
    html2canvas:{scale:2,useCORS:true,backgroundColor:"#ffffff",windowWidth:W,width:W,scrollX:0,scrollY:0},
    jsPDF:{unit:"px",format:[W,H],orientation:orient}
  }).from(sheet).toPdf().get("pdf").then(function(pdf){
    restore();
    if(inApp){
      const url=pdf.output("bloburl");
      if(win){ win.location.href=url; } else { location.href=url; }
    }else{
      pdf.save(fname);
    }
  }).catch(function(){ restore(); if(win){ try{win.close();}catch(e){} } window.print(); });
}

/* ----- 草稿（整張單）----- */
function saveDraft(){
  const d={
    qdate:val("qdate"), col1:val("col1"), col2:val("col2"),
    c_company:val("c_company"), c_tax:val("c_tax"), c_name:val("c_name"),
    c_addr:val("c_addr"), c_phone:val("c_phone"), c_fax:val("c_fax"),
    notes:val("notes"), items
  };
  localStorage.setItem("ss_draft", JSON.stringify(d));
  alert("已儲存草稿到本機。");
}
function loadDraft(){
  const d=JSON.parse(localStorage.getItem("ss_draft")||"null");
  if(!d){ alert("沒有已存草稿。"); return; }
  ["qdate","col1","col2","c_company","c_tax","c_name","c_addr","c_phone","c_fax","notes"]
    .forEach(k=>{ if(d[k]!==undefined) document.getElementById(k).value=d[k]; });
  items = d.items||[];
  renderItemRows(); render();
}
function clearCustomer(){
  ["c_company","c_tax","c_name","c_addr","c_phone","c_fax"].forEach(k=>document.getElementById(k).value="");
  render();
}

/* ----- 初始化 ----- */
function init(){
  document.getElementById("qdate").value=todayROC();
  document.getElementById("notes").value=DEFAULT_NOTES;
  addItem();          // 預設一列：碩成2號 粉狀 25kg
  if(isInApp()){
    document.getElementById("pdfHint").innerHTML=
      "在 LINE 內：按「下載 PDF」會開啟 PDF 畫面，再點手機<b>分享鈕（方框向上箭頭）</b>→「儲存到檔案」或直接傳給客戶。";
  }
}
init();
