<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>產銷班互動式儀表板 + CRM</title>
<style>
:root{--bg:#f1f3f5;--card:#fff;--ink:#20262b;--mut:#6c757d;--line:#e2e6ea;
 --a:#1a7a4c;--a2:#4aa06a;--b:#2b6cb0;--c:#c8862a;
 --s0:#8a978d;--s1:#2b6cb0;--s2:#c8862a;--s3:#1a7a4c;--s4:#c0504a;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
 font-family:-apple-system,"PingFang TC","Microsoft JhengHei",system-ui,sans-serif;font-size:13.5px}
header{background:#fff;border-bottom:1px solid var(--line);padding:11px 20px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
header h1{margin:0;font-size:17px;font-weight:700}
header .s{color:var(--mut);font-size:12px}
header .upd{margin-left:auto;font-size:11.5px;color:var(--mut);background:#f6f8f9;border:1px solid var(--line);border-radius:20px;padding:3px 10px}
.wrap{padding:14px 16px 50px;max-width:1600px;margin:0 auto}

.slicers{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px;
 display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
.sl{display:flex;flex-direction:column;gap:4px}
.sl label{font-size:11px;color:var(--mut);font-weight:600}
.sl select{padding:7px 10px;border:1px solid var(--line);border-radius:7px;font-size:13px;background:#fff;min-width:145px}
.clr{padding:7px 12px;border:1px solid var(--line);background:#fff;border-radius:7px;cursor:pointer;font-size:12.5px;color:var(--mut)}
.clr:hover{background:#f6f7f8}
.fchips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-left:auto}
.fchip{background:#fff7e0;border:1px solid var(--c);color:#8a5a10;border-radius:20px;padding:4px 10px;font-size:12px;cursor:pointer}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi .l{font-size:11.5px;color:var(--mut);font-weight:600}
.kpi .v{font-size:25px;font-weight:800;margin-top:2px;letter-spacing:-.5px}
.kpi .u{font-size:12px;font-weight:600;color:var(--mut);margin-left:3px}
.kpi.k1 .v{color:var(--a)} .kpi.k2 .v{color:var(--b)} .kpi.k3 .v{color:var(--c)} .kpi.k4 .v{color:var(--s3)}
.kpi.k5 .v{color:#a1683a} .kpi.k6 .v{color:#c85f5f} .kpi.k7 .v{color:#b58b2e}
.kpi .note{font-size:10.5px;color:var(--mut);margin-top:3px}

.cbar{display:flex;gap:8px;margin-bottom:10px;align-items:center;flex-wrap:wrap}
.cbar>span:first-child{font-size:11.5px;color:var(--mut);font-weight:600}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(430px,1fr));gap:12px;margin-bottom:12px}
@media(max-width:900px){.charts{grid-template-columns:1fr}}
.chart{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 13px;min-width:0}
.chd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:9px}
.chd h3{margin:0;font-size:13px;font-weight:700;flex:1;min-width:120px}
.cctl{display:flex;gap:4px;align-items:center}
.cctl select{padding:3px 5px;border:1px solid var(--line);border-radius:6px;font-size:11px;background:#fff;color:var(--mut);max-width:96px}
.cctl .x{border:1px solid var(--line);background:#fff;color:var(--mut);border-radius:6px;width:24px;height:24px;cursor:pointer;font-size:11px}
.cctl .x:hover{background:#fdeaea;color:#c0504a;border-color:#c0504a}
.cbody{min-height:60px}
/* 直條圖 */
.cols{display:flex;align-items:flex-end;gap:5px;height:230px;padding-top:16px;overflow-x:auto}
.cwrap{flex:1;min-width:34px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;cursor:pointer;border-radius:5px;padding:2px}
.cwrap:hover{background:#f5f7f9}
.cwrap.on{background:#fff7e0;outline:1px solid var(--c)}
.cbar2{width:74%;border-radius:4px 4px 0 0;min-height:3px;transition:height .2s}
.clab{font-size:10px;color:var(--mut);margin-top:5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;writing-mode:vertical-rl;height:52px}
.cval{font-size:10px;color:var(--mut);margin-bottom:3px;font-variant-numeric:tabular-nums}
/* 圓餅/環圈 */
.pier{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.leg{flex:1;min-width:150px;max-height:200px;overflow:auto;font-size:11.5px}
.li{display:flex;align-items:center;gap:6px;padding:2px 4px;border-radius:5px;cursor:pointer}
.li:hover{background:#f5f7f9}
.li.on{background:#fff7e0;outline:1px solid var(--c)}
.li i{width:10px;height:10px;border-radius:2px;flex:none}
.li .ln{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li b{font-variant-numeric:tabular-nums}
.li em{color:var(--mut);font-style:normal;width:44px;text-align:right}
/* 樹狀圖 */
.tree{position:relative;height:230px;width:100%}
.tk{position:absolute;border:1.5px solid #fff;cursor:pointer;overflow:hidden;display:flex;align-items:center;justify-content:center;text-align:center}
.tk span{color:#fff;font-size:10.5px;line-height:1.3;padding:2px;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.tk.on{outline:2.5px solid var(--c);z-index:2}
/* KPI 卡圖 */
.minicards{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:8px}
.mc{border:1px solid var(--line);border-radius:9px;padding:11px;cursor:pointer;text-align:center}
.mc:hover{background:#f5f7f9}
.mc.on{background:#fff7e0;border-color:var(--c)}
.mcv{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.mcv span{font-size:10.5px;font-weight:600;color:var(--mut);margin-left:2px}
.mcl{font-size:11px;color:var(--mut);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 小表格 */
table.mini{width:100%;border-collapse:collapse;font-size:12px}
table.mini th{position:sticky;top:0;background:#f6f8f9;padding:5px 7px;font-size:11px}
table.mini td{padding:4px 7px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
table.mini tr[data-l]{cursor:pointer}
table.mini tr:hover td{background:#f5f7f9}
table.mini tr.on td{background:#fff7e0}
.rows{max-height:330px;overflow:auto}
.brow{display:flex;align-items:center;gap:8px;padding:2px 4px;border-radius:5px;cursor:pointer}
.brow:hover{background:#f5f7f9}
.brow.on{background:#fff7e0;outline:1px solid var(--c)}
.blab{width:86px;flex:none;font-size:12px;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btrack{flex:1;height:15px;background:#eef1f3;border-radius:4px;overflow:hidden}
.bfill{height:100%;border-radius:4px;transition:width .2s}
.bval{width:78px;flex:none;font-size:11.5px;color:var(--mut);text-align:right}

.tbar{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.tbar input[type=search]{flex:1;min-width:200px;max-width:280px;padding:7px 10px;border:1px solid var(--line);border-radius:7px;font-size:13px}
.tbar select{padding:7px 10px;border:1px solid var(--line);border-radius:7px;font-size:12.5px;background:#fff}
.btn{padding:7px 12px;border:1px solid var(--a);background:var(--a);color:#fff;border-radius:7px;cursor:pointer;font-size:12.5px;font-weight:600}
.btn.sec{background:#fff;color:var(--a)}
.tbar .cnt{font-size:12px;color:var(--mut);margin-left:auto}
.tw{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:auto}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{background:#f6f8f9;text-align:left;padding:8px 10px;font-weight:700;position:sticky;top:0;cursor:pointer;white-space:nowrap;border-bottom:1px solid var(--line)}
th:hover{background:#eef2f4}
th.crm{background:#eef6f1}
td{padding:7px 10px;border-top:1px solid var(--line);white-space:nowrap;max-width:250px;overflow:hidden;text-overflow:ellipsis}
tr.dr{cursor:pointer}
tr.dr:hover td{background:#fafbfc}
td.num{text-align:right;font-variant-numeric:tabular-nums}
td.crm{background:#fbfdfc}
.fix{color:var(--c);font-weight:700;cursor:help}
.pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}
.pg{display:flex;gap:8px;justify-content:center;align-items:center;padding:10px;font-size:12.5px;color:var(--mut)}
.pg button{padding:5px 11px;border:1px solid var(--line);background:#fff;border-radius:6px;cursor:pointer}
.pg button:disabled{opacity:.4;cursor:default}

.ov{position:fixed;inset:0;background:rgba(0,0,0,.32);z-index:39;display:none}
.ov.on{display:block}
.dw{position:fixed;top:0;right:0;height:100%;width:min(430px,94vw);background:#fff;box-shadow:-4px 0 24px rgba(0,0,0,.18);
 transform:translateX(100%);transition:.22s;z-index:40;overflow:auto;padding:20px}
.dw.on{transform:none}
.dw h2{margin:0 0 3px;font-size:17px;padding-right:34px}
.dw .cls{position:absolute;top:14px;right:16px;border:none;background:#eef1f3;border-radius:50%;width:30px;height:30px;cursor:pointer;font-size:15px}
.fx{margin:9px 0}
.fx .k{font-size:11px;color:var(--mut)}
.fx .v{font-size:13.5px;margin-top:1px;white-space:normal}
.box{background:#f4f8f5;border:1px solid var(--line);border-radius:10px;padding:13px;margin-top:12px}
.box h3{margin:0 0 8px;font-size:13.5px;color:var(--a)}
.box label{font-size:11.5px;color:var(--mut);display:block;margin:8px 0 3px;font-weight:600}
.box input,.box select,.box textarea{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:7px;font-size:13px;font-family:inherit;background:#fff}
.box textarea{min-height:72px;resize:vertical}
.ok{color:var(--a);font-size:11.5px;margin-left:8px;opacity:0;transition:.2s}
.ok.on{opacity:1}
.lnk{color:var(--b);text-decoration:none}
.hasnote{color:var(--c);font-weight:800}
</style>
</head>
<body>
<header>
  <h1>產銷班互動式儀表板 <span style="font-weight:400;font-size:13px;color:var(--mut)">＋ CRM</span></h1>
  <span class="s">農糧署產銷班組織體系 · 全台 5,322 班</span>
  <span class="upd">📅 資料更新：2026/07/17 20:29</span>
</header>
<div class="wrap">
  <div class="slicers">
    <div class="sl"><label>縣市</label><select id="f_county"></select></div>
    <div class="sl"><label>區域(鄉鎮)</label><select id="f_town"></select></div>
    <div class="sl"><label>產業別</label><select id="f_ind"></select></div>
    <div class="sl"><label>CRM 狀態</label><select id="f_st"></select></div>
    <button class="clr" onclick="clearAll()">✕ 清除篩選</button>
    <div class="fchips" id="chips"></div>
  </div>

  <div class="kpis" id="kpis"></div>

  <div class="cbar">
    <span>圖表</span>
    <button class="btn" onclick="addChart()">＋ 新增圖表</button>
    <button class="btn sec" onclick="resetCharts()">↺ 回復預設</button>
    <span style="font-size:11.5px;color:var(--mut)">每張圖可自選類型／維度／指標,點圖上的項目即篩選全頁</span>
  </div>
  <div class="charts" id="charts"></div>

  <div class="tbar">
    <input id="q" type="search" placeholder="🔍 搜尋班名 / 地址 / 農會 / 班長…">
    <button class="btn" onclick="saveCSV()">💾 存檔</button>
    <button class="btn sec" onclick="document.getElementById('imp').click()">📂 讀回存檔</button>
    <button class="btn sec" onclick="openCfg()" id="cfgbtn">⚙️ 雲端設定</button>
    <input type="file" id="imp" accept=".csv" style="display:none" onchange="loadCSV(this)">
    <span class="cnt" id="tcnt"></span>
  </div>
  <div class="tw"><table><thead><tr id="th"></tr></thead><tbody id="tb"></tbody></table></div>
  <div class="pg" id="pg"></div>
</div>
<div class="ov" id="ov" onclick="closeDw()"></div>

<script>

const R=JSON.parse(document.getElementById('D').textContent);
const C={county:0,town:1,name:2,ind:3,mem:4,val:5,unit:6,addr:7,assoc:8,date:9,id:10,fix:11};
const ST=["未聯絡","已聯絡","跟進中","已成交","婉拒"];
const STC={"未聯絡":"var(--s0)","已聯絡":"var(--s1)","跟進中":"var(--s2)","已成交":"var(--s3)","婉拒":"var(--s4)"};
let F={county:"",town:"",ind:"",st:""}, page=0, sortI=-1, sortD=1, q="";
const PAGE=50;
const isHa=r=>r[C.unit].indexOf("公頃")===0;

/* ── CRM 儲存(瀏覽器本機) ── */
const KEY="agrcrm_v1";
let CRM={};
try{CRM=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){CRM={}}
const cget=id=>CRM[id]||{};
function cset(id,v){
  if(!v.leader&&!v.phone&&!v.note&&!v.next&&(!v.status||v.status==="未聯絡"))delete CRM[id];
  else CRM[id]=v;
  localStorage.setItem(KEY,JSON.stringify(CRM));
}
const hasCRM=id=>{const c=cget(id);return !!(c.leader||c.phone||c.note||(c.status&&c.status!=="未聯絡"))};

function rows(){
  let x=R;
  if(F.county)x=x.filter(r=>r[C.county]===F.county);
  if(F.town)  x=x.filter(r=>r[C.town]===F.town);
  if(F.ind)   x=x.filter(r=>r[C.ind]===F.ind);
  if(F.st)    x=x.filter(r=>(cget(r[C.id]).status||"未聯絡")===F.st);
  if(q){const s=q.toLowerCase();
    x=x.filter(r=>{const c=cget(r[C.id]);
      return (r[C.name]+r[C.addr]+r[C.assoc]+(c.leader||"")+(c.phone||"")+(c.note||"")).toLowerCase().includes(s)})}
  return x;
}
const fmt=(n,d)=>n.toLocaleString('zh-TW',{minimumFractionDigits:d||0,maximumFractionDigits:d||0});

function renderSlicers(){
  sel('f_county',[...new Set(R.map(r=>r[C.county]))].sort((a,b)=>a.localeCompare(b,'zh')),F.county,'全部縣市',
      v=>{F.county=v;F.town="";page=0;render()});
  sel('f_town',[...new Set(R.filter(r=>!F.county||r[C.county]===F.county).map(r=>r[C.town]))].filter(Boolean).sort((a,b)=>a.localeCompare(b,'zh')),
      F.town,'全部區域',v=>{F.town=v;page=0;render()});
  sel('f_ind',[...new Set(R.map(r=>r[C.ind]))].filter(Boolean).sort((a,b)=>a.localeCompare(b,'zh')),F.ind,'全部產業',
      v=>{F.ind=v;page=0;render()});
  sel('f_st',ST,F.st,'全部狀態',v=>{F.st=v;page=0;render()});
  const ch=document.getElementById('chips');ch.innerHTML="";
  [['county','縣市'],['town','區域'],['ind','產業'],['st','狀態']].forEach(([k,lab])=>{
    if(F[k]){const e=document.createElement('span');e.className="fchip";e.textContent=lab+"："+F[k]+" ✕";
      e.onclick=()=>{F[k]="";if(k=='county')F.town="";page=0;render()};ch.appendChild(e)}});
}
function sel(id,opts,cur,ph,cb){
  const s=document.getElementById(id);
  s.innerHTML="<option value=''>"+ph+"</option>"+opts.map(o=>`<option${o===cur?' selected':''}>${o}</option>`).join("");
  s.onchange=()=>cb(s.value);
}

const UNITS=[{u:"公頃",lab:"面積",cls:"k3",test:r=>isHa(r),dec:1},
             {u:"頭",lab:"畜牧規模",cls:"k5",test:r=>r[C.unit]==="頭",dec:0,note:"毛豬/牛/羊/鹿"},
             {u:"隻",lab:"禽類規模",cls:"k6",test:r=>r[C.unit]==="隻",dec:0,note:"肉雞/蛋雞/水禽"},
             {u:"箱",lab:"蜂箱",cls:"k7",test:r=>r[C.unit]==="箱",dec:0,note:"養蜂"}];
function renderKPI(){
  const x=rows(), host=document.getElementById('kpis');host.innerHTML="";
  const card=(cls,lab,val,unit,note)=>{
    const d=document.createElement('div');d.className="kpi "+cls;
    d.innerHTML=`<div class="l">${lab}</div><div class="v">${val}${unit?`<span class="u">${unit}</span>`:""}</div>`+
      (note?`<div class="note">${note}</div>`:"");
    host.appendChild(d);};
  card("k1","班數",fmt(x.length),"");

/* ── 圖表產生器:維度 / 指標 / 類型 ── */
const yearOf=r=>{const m=/^(\d+)年/.exec(r[C.date]);return m?(Math.floor(+m[1]/10)*10)+"年代":"(未填)"};
const DIMS={
  county:{lab:"縣市",  get:r=>r[C.county]||"(未填)", fkey:"county"},
  town:  {lab:"區域(鄉鎮)",get:r=>r[C.town]||"(未填)", fkey:"town"},
  ind:   {lab:"產業別",get:r=>r[C.ind]||"(未填)",   fkey:"ind"},
  assoc: {lab:"所屬農會",get:r=>r[C.assoc]||"(未填)"},
  unit:  {lab:"規模單位",get:r=>r[C.unit]||"(未填)"},
  year:  {lab:"設立年代",get:yearOf},
  status:{lab:"CRM狀態",get:r=>cget(r[C.id]).status||"未聯絡", fkey:"st"},
};
const sum=(l,f)=>l.reduce((s,r)=>s+f(r),0);
const MEAS={
  cnt:    {lab:"班數",    fn:l=>l.length,                         dec:0,unit:"班",  col:"var(--a2)"},
  mem:    {lab:"班員數",  fn:l=>sum(l,r=>r[C.mem]),               dec:0,unit:"人",  col:"var(--b)"},
  area:   {lab:"面積(公頃)",fn:l=>sum(l.filter(isHa),r=>r[C.val]), dec:1,unit:"公頃",col:"var(--c)"},
  avgmem: {lab:"平均班員",fn:l=>l.length?sum(l,r=>r[C.mem])/l.length:0, dec:1,unit:"人/班",col:"var(--b)"},
  avgarea:{lab:"平均面積",fn:l=>{const h=l.filter(isHa);return h.length?sum(h,r=>r[C.val])/h.length:0}, dec:2,unit:"公頃/班",col:"var(--c)"},
  head:   {lab:"畜牧(頭)",fn:l=>sum(l.filter(r=>r[C.unit]==="頭"),r=>r[C.val]), dec:0,unit:"頭",col:"#a1683a"},
  bird:   {lab:"禽類(隻)",fn:l=>sum(l.filter(r=>r[C.unit]==="隻"),r=>r[C.val]), dec:0,unit:"隻",col:"#c85f5f"},
  box:    {lab:"蜂箱(箱)",fn:l=>sum(l.filter(r=>r[C.unit]==="箱"),r=>r[C.val]), dec:0,unit:"箱",col:"#b58b2e"},
  crm:    {lab:"已建檔班數",fn:l=>l.filter(r=>hasCRM(r[C.id])).length, dec:0,unit:"班",col:"var(--s3)"},
};
const TYPES={bar:"橫條圖",col:"直條圖",pie:"圓餅圖",donut:"環圈圖",line:"折線圖",
             tree:"樹狀圖",lolli:"棒棒糖圖",table:"表格",card:"KPI卡"};
const PAL=["#1a7a4c","#2b6cb0","#c8862a","#7a5cc0","#c85f5f","#2f9e8f","#a1683a","#8a9a2b","#b5487c","#4b7d9e",
           "#6aa84f","#e0a63a","#5f6caf","#c0504a","#3f9e6d","#9e6b3f","#556b2f","#8b5a8c","#4682b4","#a0522d"];
const CKEY="agrcharts_v1";
const DEF=[{t:"bar",d:"county",m:"cnt"},{t:"bar",d:"ind",m:"cnt"}];
let CHARTS=(()=>{try{const v=JSON.parse(localStorage.getItem(CKEY));return Array.isArray(v)&&v.length?v:DEF.slice()}catch(e){return DEF.slice()}})();
const saveCharts=()=>localStorage.setItem(CKEY,JSON.stringify(CHARTS));
function addChart(){CHARTS.push({t:"bar",d:"county",m:"cnt"});saveCharts();renderCharts()}
function delChart(i){CHARTS.splice(i,1);saveCharts();renderCharts()}
function setChart(i,k,v){CHARTS[i][k]=v;saveCharts();renderCharts()}
function resetCharts(){CHARTS=DEF.slice();saveCharts();renderCharts()}

function agg(list,dimKey,meaKey){
  const D=DIMS[dimKey],M=MEAS[meaKey],m={};
  list.forEach(r=>{const k=D.get(r);(m[k]=m[k]||[]).push(r)});
  return Object.entries(m).map(([k,v])=>[k,M.fn(v)]).filter(e=>e[1]>0).sort((a,b)=>b[1]-a[1]);
}
function renderCharts(){
  const host=document.getElementById('charts');host.innerHTML="";
  const x=rows();
  CHARTS.forEach((cfg,i)=>{
    // 選了縣市時,county 維度自動改看區域(Power BI 的向下鑽研)
    let dim=cfg.d; if(dim==="county"&&F.county)dim="town";
    const D=DIMS[dim],M=MEAS[cfg.m];
    const data=agg(x,dim,cfg.m);
    const box=document.createElement('div');box.className="chart";
    box.innerHTML=`<div class="chd">
        <h3>${D.lab} × ${M.lab}${dim!==cfg.d?' <span style="font-weight:400;color:var(--mut)">(已鑽研)</span>':''}</h3>
        <div class="cctl">
          <select onchange="setChart(${i},'t',this.value)">${Object.entries(TYPES).map(([k,v])=>`<option value="${k}"${cfg.t===k?' selected':''}>${v}</option>`).join("")}</select>
          <select onchange="setChart(${i},'d',this.value)">${Object.entries(DIMS).map(([k,v])=>`<option value="${k}"${cfg.d===k?' selected':''}>${v.lab}</option>`).join("")}</select>
          <select onchange="setChart(${i},'m',this.value)">${Object.entries(MEAS).map(([k,v])=>`<option value="${k}"${cfg.m===k?' selected':''}>${v.lab}</option>`).join("")}</select>
          <button class="x" onclick="delChart(${i})" title="移除這張圖">✕</button>
        </div></div>
      <div class="cbody" id="cb${i}"></div>`;
    host.appendChild(box);
    draw(document.getElementById('cb'+i),cfg.t,data,M,D.fkey,dim);
  });
  if(!CHARTS.length)host.innerHTML=`<div class="chart" style="text-align:center;color:var(--mut);padding:28px">
    目前沒有圖表 · 按上方「＋ 新增圖表」開始</div>`;
}
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function clickDim(fkey,lab){ if(!fkey)return; F[fkey]=F[fkey]===lab?"":lab; if(fkey==='county')F.town=""; page=0; render(); }
function isSel(fkey,lab){return fkey&&F[fkey]===lab}

function draw(el,type,data,M,fkey,dim){
  el.innerHTML="";
  if(!data.length){el.innerHTML=`<div style="color:var(--mut);padding:18px;text-align:center">此條件下沒有資料</div>`;return}
  const top=data.slice(0,type==="card"?4:(type==="pie"||type==="donut"?10:(type==="tree"?14:20)));
  const max=Math.max(...top.map(d=>d[1])), tot=data.reduce((s,d)=>s+d[1],0);
  const V=v=>fmt(v,M.dec);

  if(type==="bar"||type==="lolli"){
    const w=document.createElement('div');w.className="rows";
    top.forEach(([lab,val])=>{
      const d=document.createElement('div');d.className="brow"+(isSel(fkey,lab)?" on":"");
      d.innerHTML=type==="bar"
        ? `<div class="blab" title="${esc(lab)}">${esc(lab)}</div>
           <div class="btrack"><div class="bfill" style="width:${val/max*100}%;background:${M.col}"></div></div>
           <div class="bval">${V(val)} ${M.unit}</div>`
        : `<div class="blab" title="${esc(lab)}">${esc(lab)}</div>
           <div class="btrack" style="background:transparent;position:relative">
             <div style="position:absolute;top:50%;left:0;height:2px;width:${val/max*100}%;background:${M.col};opacity:.45"></div>
             <div style="position:absolute;top:50%;left:calc(${val/max*100}% - 5px);width:10px;height:10px;border-radius:50%;background:${M.col};transform:translateY(-50%)"></div>
           </div>
           <div class="bval">${V(val)} ${M.unit}</div>`;
      d.onclick=()=>clickDim(fkey,lab); w.appendChild(d);});
    el.appendChild(w);return;
  }
  if(type==="col"){
    const w=document.createElement('div');w.className="cols";
    top.slice(0,14).forEach(([lab,val])=>{
      const d=document.createElement('div');d.className="cwrap"+(isSel(fkey,lab)?" on":"");
      d.innerHTML=`<div class="cval">${V(val)}</div>
        <div class="cbar2" style="height:${Math.max(3,val/max*100)}%;background:${M.col}"></div>
        <div class="clab" title="${esc(lab)}">${esc(lab)}</div>`;
      d.onclick=()=>clickDim(fkey,lab); w.appendChild(d);});
    el.appendChild(w);return;
  }
  if(type==="pie"||type==="donut"){
    const R0=type==="donut"?46:0, size=190, cx=95, cy=95, r=88;
    let a0=-Math.PI/2, svg=`<svg viewBox="0 0 ${size} ${size}" style="width:190px;height:190px;flex:none">`;
    const sumTop=top.reduce((s,d)=>s+d[1],0);
    top.forEach(([lab,val],i)=>{
      const a1=a0+val/sumTop*Math.PI*2, big=(a1-a0)>Math.PI?1:0;
      const p=(rr,a)=>[cx+rr*Math.cos(a),cy+rr*Math.sin(a)];
      const [x1,y1]=p(r,a0),[x2,y2]=p(r,a1),[x3,y3]=p(R0,a1),[x4,y4]=p(R0,a0);
      svg+=`<path d="M${x1},${y1} A${r},${r} 0 ${big},1 ${x2},${y2} L${x3},${y3} ${R0?`A${R0},${R0} 0 ${big},0 ${x4},${y4}`:''} Z"
        fill="${PAL[i%PAL.length]}" opacity="${isSel(fkey,lab)?1:.86}" stroke="#fff" stroke-width="1.2"
        style="cursor:pointer" data-l="${esc(lab)}"><title>${esc(lab)}：${V(val)} ${M.unit}</title></path>`;
      a0=a1;});
    if(R0)svg+=`<text x="${cx}" y="${cy-4}" text-anchor="middle" font-size="12" fill="var(--mut)">合計</text>
                <text x="${cx}" y="${cy+13}" text-anchor="middle" font-size="14" font-weight="700">${V(tot)}</text>`;
    svg+=`</svg>`;
    const wrap=document.createElement('div');wrap.className="pier";
    wrap.innerHTML=svg+`<div class="leg">`+top.map(([lab,val],i)=>
      `<div class="li${isSel(fkey,lab)?" on":""}" data-l="${esc(lab)}"><i style="background:${PAL[i%PAL.length]}"></i>
        <span class="ln" title="${esc(lab)}">${esc(lab)}</span><b>${V(val)}</b>
        <em>${(val/sumTop*100).toFixed(1)}%</em></div>`).join("")+`</div>`;
    el.appendChild(wrap);
    wrap.querySelectorAll('[data-l]').forEach(n=>n.onclick=()=>clickDim(fkey,n.dataset.l));
    return;
  }
  if(type==="line"){
    // 折線圖:維度若是年代則依年代排序,否則依值
    const d2=(dim==="year")?data.slice().sort((a,b)=>String(a[0]).localeCompare(String(b[0]))):top.slice().reverse();
    const W=520,H=210,pl=52,pb=34,pt=12,pr=12;
    const mx=Math.max(...d2.map(d=>d[1])), n=d2.length;
    const px=i=>pl+(n<2?(W-pl-pr)/2:i*(W-pl-pr)/(n-1)), py=v=>H-pb-(v/mx)*(H-pb-pt);
    let g="";
    [0,.25,.5,.75,1].forEach(t=>{const y=H-pb-t*(H-pb-pt);
      g+=`<line x1="${pl}" y1="${y}" x2="${W-pr}" y2="${y}" stroke="var(--line)" stroke-width="1"/>
          <text x="${pl-7}" y="${y+4}" text-anchor="end" font-size="10" fill="var(--mut)">${fmt(mx*t,M.dec)}</text>`;});
    const pts=d2.map((d,i)=>`${px(i)},${py(d[1])}`).join(" ");
    g+=`<polyline points="${pts}" fill="none" stroke="${M.col}" stroke-width="2.5" stroke-linejoin="round"/>`;
    g+=`<polygon points="${pl},${H-pb} ${pts} ${px(n-1)},${H-pb}" fill="${M.col}" opacity=".1"/>`;
    d2.forEach((d,i)=>{g+=`<circle cx="${px(i)}" cy="${py(d[1])}" r="${isSel(fkey,d[0])?5:3.5}" fill="${M.col}"
        style="cursor:pointer" data-l="${esc(d[0])}"><title>${esc(d[0])}：${V(d[1])} ${M.unit}</title></circle>`;
      if(n<=14)g+=`<text x="${px(i)}" y="${H-pb+15}" text-anchor="middle" font-size="9.5" fill="var(--mut)"
        transform="rotate(-28 ${px(i)} ${H-pb+15})">${esc(String(d[0]).slice(0,6))}</text>`;});
    const s=document.createElement('div');s.innerHTML=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:230px">${g}</svg>`;
    el.appendChild(s);
    s.querySelectorAll('[data-l]').forEach(nd=>nd.onclick=()=>clickDim(fkey,nd.dataset.l));
    return;
  }
  if(type==="tree"){
    // 樹狀圖:簡易 squarify(依比例切列)
    const W=100,H=100,items=top.map(([l,v])=>({l,v}));
    const total=items.reduce((s,d)=>s+d.v,0);
    let x0=0,y0=0,w=W,h=H,idx=0,out=[];
    while(idx<items.length){
      const remain=items.slice(idx).reduce((s,d)=>s+d.v,0);
      const horiz=w>=h;
      let take=[],acc=0;
      for(let i=idx;i<items.length;i++){take.push(items[i]);acc+=items[i].v;
        if(take.length>=Math.max(1,Math.round(Math.sqrt(items.length-idx))))break;}
      const frac=acc/remain, band=horiz?w*frac:h*frac;
      let off=0;
      take.forEach(t=>{const part=t.v/acc, sw=horiz?band:w*part, sh=horiz?h*part:band;
        out.push({...t,x:horiz?x0:x0+off,y:horiz?y0+off:y0,w:sw,h:sh});
        off+=horiz?sh:sw;});
      if(horiz){x0+=band;w-=band}else{y0+=band;h-=band}
      idx+=take.length;
    }
    const g=out.map((o,i)=>`<div class="tk${isSel(fkey,o.l)?" on":""}" data-l="${esc(o.l)}"
      style="left:${o.x}%;top:${o.y}%;width:${o.w}%;height:${o.h}%;background:${PAL[i%PAL.length]}">
      <span>${esc(o.l)}<br><b>${V(o.v)}</b></span></div>`).join("");
    const d=document.createElement('div');d.className="tree";d.innerHTML=g;el.appendChild(d);
    d.querySelectorAll('[data-l]').forEach(n=>n.onclick=()=>clickDim(fkey,n.dataset.l));
    return;
  }
  if(type==="card"){
    const d=document.createElement('div');d.className="minicards";
    d.innerHTML=top.map(([lab,val])=>`<div class="mc${isSel(fkey,lab)?" on":""}" data-l="${esc(lab)}">
      <div class="mcv" style="color:${M.col}">${V(val)}<span>${M.unit}</span></div>
      <div class="mcl">${esc(lab)}</div></div>`).join("");
    el.appendChild(d);
    d.querySelectorAll('[data-l]').forEach(n=>n.onclick=()=>clickDim(fkey,n.dataset.l));
    return;
  }
  // table
  const t=document.createElement('div');t.className="rows";
  t.innerHTML=`<table class="mini"><thead><tr><th>${esc(DIMS[dim].lab)}</th><th style="text-align:right">${esc(M.lab)}</th><th style="text-align:right">佔比</th></tr></thead><tbody>`+
    data.slice(0,50).map(([lab,val])=>`<tr class="${isSel(fkey,lab)?"on":""}" data-l="${esc(lab)}">
      <td>${esc(lab)}</td><td style="text-align:right">${V(val)}</td>
      <td style="text-align:right;color:var(--mut)">${(val/tot*100).toFixed(1)}%</td></tr>`).join("")+`</tbody></table>`;
  el.appendChild(t);
  t.querySelectorAll('[data-l]').forEach(n=>n.onclick=()=>clickDim(fkey,n.dataset.l));
}
/* 欄位: [標題, 取值fn, 是否CRM欄, 排序key] */
const COLS=[
 ["產銷班班名",r=>r[C.name],0],
 ["班長姓名",r=>cget(r[C.id]).leader||"",1],
 ["電話",r=>cget(r[C.id]).phone||"",1],
 ["CRM狀態",r=>cget(r[C.id]).status||"未聯絡",1],
 ["備註",r=>cget(r[C.id]).note||"",1],
 ["縣市",r=>r[C.county],0],
 ["區域",r=>r[C.town],0],
 ["產業別",r=>r[C.ind],0],
 ["班員",r=>r[C.mem],0],
 ["規模",r=>r[C.val],0],
 ["單位",r=>r[C.unit],0],
 ["班場所地址",r=>r[C.addr],0],
 ["所屬農會",r=>r[C.assoc],0],
 ["設立日期",r=>r[C.date],0],
];
function renderTable(){
  let x=rows().slice();
  if(sortI>=0){const f=COLS[sortI][1];
    x.sort((a,b)=>{const p=f(a),r=f(b);
      return (typeof p==="number"?p-r:String(p).localeCompare(String(r),'zh'))*sortD})}
  const pages=Math.max(1,Math.ceil(x.length/PAGE)); if(page>=pages)page=pages-1;
  const th=document.getElementById('th');th.innerHTML="";
  COLS.forEach(([lab,,crm],i)=>{const h=document.createElement('th');
    h.className=crm?"crm":"";h.textContent=lab+(sortI===i?(sortD>0?" ▲":" ▼"):"");
    h.onclick=()=>{if(sortI===i)sortD=-sortD;else{sortI=i;sortD=1}renderTable()};th.appendChild(h)});
  const tb=document.getElementById('tb');tb.innerHTML="";
  x.slice(page*PAGE,page*PAGE+PAGE).forEach(r=>{
    const tr=document.createElement('tr');tr.className="dr";
    COLS.forEach(([lab,f,crm],i)=>{
      const td=document.createElement('td'); const v=f(r);
      if(crm)td.className="crm";
      if(lab==="CRM狀態"){td.innerHTML=`<span class="pill" style="background:${STC[v]}1f;color:${STC[v]}">${v}</span>`}
      else if(lab==="班員"){td.className="num";td.textContent=fmt(v)}
      else if(lab==="規模"){td.className="num";td.textContent=fmt(v,2);
        if(r[C.fix]){const s=document.createElement('span');s.className="fix";s.textContent=" ✎";
          s.title="官方原始資料登打錯誤,已人工校正";td.appendChild(s)}}
      else if(lab==="產銷班班名"){td.innerHTML=`<a class="lnk" href="https://agrpmg.afa.gov.tw/agr-Sed/agrJsp/ClassSimpleQuery/ClassSQData.jsp?classID=${r[C.id]}" target="_blank" onclick="event.stopPropagation()">${v}</a>`}
      else td.textContent=v;
      td.title=String(v);tr.appendChild(td);});
    tr.onclick=()=>openDw(r);tb.appendChild(tr);});
  document.getElementById('tcnt').textContent=`共 ${fmt(x.length)} 筆`;
  document.getElementById('pg').innerHTML=
    `<button ${page<=0?'disabled':''} onclick="page--;renderTable()">◀ 上一頁</button>
     <span>第 ${page+1} / ${pages} 頁</span>
     <button ${page>=pages-1?'disabled':''} onclick="page++;renderTable()">下一頁 ▶</button>`;
}

  const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  let h=`<button class="cls" onclick="closeDw()">✕</button><h2>${esc(r[C.name])}</h2>
   <div style="color:var(--mut);font-size:12px">${esc(r[C.county])}${esc(r[C.town])} · ${esc(r[C.ind])}</div>`;

            ["班場所地址",r[C.addr]],["所屬農會",r[C.assoc]],["設立日期",r[C.date]]];
  F2.forEach(([k,v])=>{if(v)h+=`<div class="fx"><div class="k">${k}</div><div class="v">${esc(v)}</div></div>`});
  if(r[C.fix])h+=`<div class="fx"><div class="k">⚠ 資料校正</div><div class="v" style="color:var(--c)">官方原始值有登打錯誤,已人工校正</div></div>`;
  if(r[C.addr])h+=`<div class="fx"><a class="btn sec" target="_blank" href="https://www.google.com/maps/search/${encodeURIComponent(r[C.addr])}">📍 地圖</a>
    <a class="btn sec" target="_blank" href="https://agrpmg.afa.gov.tw/agr-Sed/agrJsp/ClassSimpleQuery/ClassSQData.jsp?classID=${r[C.id]}">🔗 官網原始頁</a></div>`;
  h+=`<div class="box"><h3>📇 CRM 追蹤 <span class="ok" id="ok">已儲存 ✓</span></h3>
    <label>班長姓名 <span style="font-weight:400">(官方無此資料,由你填寫)</span></label>
    <input id="e_leader" value="${esc(c.leader||'')}" placeholder="例:王大明">
    <label>電話 / 手機</label>
    <input id="e_phone" value="${esc(c.phone||'')}" placeholder="例:0912-345-678">
    <label>聯絡狀態</label>
    <select id="e_status">${ST.map(s=>`<option${(c.status||'未聯絡')===s?' selected':''}>${s}</option>`).join("")}</select>
    <label>下次跟進日</label>
    <input id="e_next" type="date" value="${esc(c.next||'')}">
    <label>備註 / 拜訪紀錄</label>
    <textarea id="e_note" placeholder="通話內容、需求、用肥習慣、報價…">${esc(c.note||'')}</textarea>
    <div style="margin-top:10px"><button class="btn" onclick="saveCRM()">儲存</button></div></div>`;
  const d=document.getElementById('dw');d.innerHTML=h;d.classList.add('on');
  document.getElementById('ov').classList.add('on');
}
function closeDw(){document.getElementById('dw').classList.remove('on');document.getElementById('ov').classList.remove('on')}
function saveCRM(){
  const g=id=>document.getElementById(id).value.trim();
  cset(cur[C.id],{leader:g('e_leader'),phone:g('e_phone'),status:g('e_status'),
                  next:g('e_next'),note:g('e_note'),ts:new Date().toISOString().slice(0,10)});
  const o=document.getElementById('ok');o.classList.add('on');setTimeout(()=>o.classList.remove('on'),1400);
  renderKPI();renderTable();
}
/* ── 雲端設定(Google Apps Script) ── */
const GKEY="agrgas_v1";
const gasCfg=()=>{try{return JSON.parse(localStorage.getItem(GKEY))||{}}catch(e){return {}}};
function markCfg(){document.getElementById('cfgbtn').textContent=gasCfg().url?"☁️ 雲端已連線":"⚙️ 雲端設定"}
function openCfg(){
  const c=gasCfg();
  const h=`<button class="cls" onclick="closeDw()">✕</button><h2>☁️ 雲端設定</h2>
   <div style="color:var(--mut);font-size:12px">設定後,按「存檔」會自動把 CRM 紀錄寫進你的 Google 雲端硬碟</div>
   <div class="box"><h3>Google Apps Script</h3>
     <label>網頁應用程式網址</label>
     <input id="g_url" value="${(c.url||'').replace(/"/g,'&quot;')}" placeholder="https://script.google.com/macros/s/.../exec">
     <label>TOKEN(你在 GAS 裡設的密碼)</label>
     <input id="g_tok" value="${(c.token||'').replace(/"/g,'&quot;')}" placeholder="請改成你自己的密碼abc123">
     <div style="margin-top:10px;display:flex;gap:8px">
       <button class="btn" onclick="saveCfg()">儲存</button>
       <button class="btn sec" onclick="testCfg()">測試連線</button>
       ${c.url?`<button class="btn sec" onclick="clearCfg()" style="border-color:#c0504a;color:#c0504a">移除</button>`:``}
     </div>
     <div id="g_msg" style="margin-top:9px;font-size:12px"></div>
   </div>
   <div style="font-size:11.5px;color:var(--mut);margin-top:12px;line-height:1.6">
     還沒設定過?桌面上的 <b>GAS_雲端存檔.gs</b> 檔案裡有完整步驟(約 3 分鐘)。<br>
     沒設定也沒關係——「存檔」一樣會下載到你電腦。
   </div>`;
  const d=document.getElementById('dw');d.innerHTML=h;d.classList.add('on');
  document.getElementById('ov').classList.add('on');
}
function saveCfg(){
  const u=document.getElementById('g_url').value.trim(), t=document.getElementById('g_tok').value.trim();
  if(u&&!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(u)){
    msgCfg("網址格式不對,應該長這樣:https://script.google.com/macros/s/..../exec","#c0504a");return}
  localStorage.setItem(GKEY,JSON.stringify({url:u,token:t}));
  markCfg();msgCfg("已儲存 ✓","var(--a)");
}
function clearCfg(){localStorage.removeItem(GKEY);markCfg();msgCfg("已移除雲端設定","var(--mut)");}
function msgCfg(s,c){const e=document.getElementById('g_msg');if(e){e.textContent=s;e.style.color=c||"var(--ink)"}}
async function testCfg(){
  const u=document.getElementById('g_url').value.trim(), t=document.getElementById('g_tok').value.trim();
  if(!u){msgCfg("請先貼上網址","#c0504a");return}
  msgCfg("測試中…","var(--mut)");
  const r=await gasPost(u,t,"連線測試.csv","測試,OK\r\n1,連線成功");
  msgCfg(r.ok?("✓ "+r.msg):("✗ "+r.msg), r.ok?"var(--a)":"#c0504a");
}
async function gasPost(url,token,filename,content){
  try{
    const res=await fetch(url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify({token,filename,content})});
    return await res.json();
  }catch(e){return {ok:false,msg:"連線失敗("+e+")。請確認 GAS 部署時「具有存取權的使用者」選了『所有人』。"}}
}

/* ── 存檔 / 讀回 ── */
function csvCell(v){return '"'+String(v==null?'':v).replace(/"/g,'""')+'"'}
function crmCSV(){
  const head=["classID","產銷班班名","縣市","區域","產業別","班長姓名","電話","CRM狀態","下次跟進","備註","更新日"];
  const out=[head.join(",")];
  R.forEach(r=>{const c=cget(r[C.id]); if(!hasCRM(r[C.id])&&!c.next)return;
    out.push([r[C.id],r[C.name],r[C.county],r[C.town],r[C.ind],c.leader||"",c.phone||"",
              c.status||"",c.next||"",c.note||"",c.ts||""].map(csvCell).join(","))});
  return out;
}
async function saveCSV(){
  const out=crmCSV();
  if(out.length<2){alert("目前還沒有任何 CRM 紀錄。\n點開任一班、填班長或備註後儲存,就會出現在存檔裡。");return}
  const d=new Date(), p=n=>String(n).padStart(2,'0');
  const name=`產銷班CRM_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}.csv`;
  const body=out.join("\r\n");
  // 1) 下載到電腦
  const b=new Blob(["﻿"+body],{type:"text/csv;charset=utf-8"});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();
  // 2) 若已設定雲端,順便上傳
  const c=gasCfg();
  if(c.url){
    const r=await gasPost(c.url,c.token,name,body);
    alert(r.ok? `已存檔:${name}\n共 ${out.length-1} 筆\n\n✓ 已下載到電腦\n☁️ ${r.msg}`
              : `已下載到電腦:${name}(共 ${out.length-1} 筆)\n\n⚠️ 雲端上傳失敗:${r.msg}`);
  }else{
    alert(`已存檔:${name}\n共 ${out.length-1} 筆 CRM 紀錄。\n\n提示:按「⚙️ 雲端設定」接上 Google Apps Script,以後存檔就會自動上傳雲端硬碟。`);
  }
}
function loadCSV(inp){
  const f=inp.files[0]; if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const lines=rd.result.replace(/^﻿/,'').split(/\r?\n/).filter(Boolean);
      const parse=l=>{const o=[];let c="",qq=false;
        for(let i=0;i<l.length;i++){const ch=l[i];
          if(qq){if(ch==='"'){if(l[i+1]==='"'){c+='"';i++}else qq=false}else c+=ch}
          else{if(ch==='"')qq=true;else if(ch===','){o.push(c);c=""}else c+=ch}}
        o.push(c);return o};
      const H=parse(lines[0]); const ix=n=>H.indexOf(n);
      let n=0;
      lines.slice(1).forEach(l=>{const c=parse(l); const id=c[ix("classID")]; if(!id)return;
        cset(id,{leader:c[ix("班長姓名")]||"",phone:c[ix("電話")]||"",status:c[ix("CRM狀態")]||"未聯絡",
                 next:c[ix("下次跟進")]||"",note:c[ix("備註")]||"",ts:c[ix("更新日")]||""}); n++});
      alert(`已讀回 ${n} 筆 CRM 紀錄。`);
      render();
    }catch(e){alert("讀取失敗:檔案格式不符。請用本系統「存檔」產生的 CSV。")}
    inp.value="";
  };
  rd.readAsText(f);
}
function clearAll(){F={county:"",town:"",ind:"",st:""};q="";document.getElementById('q').value="";page=0;render()}
function render(){renderSlicers();renderKPI();renderCharts();renderTable();markCfg()}
document.getElementById('q').oninput=e=>{q=e.target.value;page=0;renderKPI();renderCharts();renderTable()};
render();
</script>
