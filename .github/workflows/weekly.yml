name: 每週推送有機肥料市場週報

on:
  # 每週一台北時間 08:00 = UTC 週一 00:00
  schedule:
    - cron: '0 0 * * 1'
  # 也可以在 GitHub Actions 頁面手動觸發
  workflow_dispatch:

jobs:
  push-weekly-report:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: write  # 允許 commit snapshot 回 repo

    env:
      # 圖卡用的中文字型（apt 裝好後的路徑）
      CARD_FONT_PATH: /usr/share/fonts/truetype/wqy/wqy-microhei.ttc

    steps:
      - name: Checkout 程式碼
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安裝中文字型（PIL 圖卡需要）
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-wqy-microhei

      - name: 安裝 Python 套件
        run: pip install -r requirements.txt

      - name: 跑爬蟲並推 LINE
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
          CATBOX_USERHASH: ${{ secrets.CATBOX_USERHASH }}
        run: python weekly_line_push.py

      - name: 把 PDF 快照與金句使用紀錄 commit 回 repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add snapshots/
          if ! git diff --staged --quiet; then
            git commit -m "chore: update snapshots & motivation log $(date -u +%Y-%m-%d)"
            git push
          else
            echo "snapshot 無變動，跳過 commit"
          fi
